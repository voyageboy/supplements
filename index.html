<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplement Inventory V3</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:16px;
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.container{
    padding:16px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    cursor:pointer;
}

.primary{
    background:#111;
    color:white;
    width:100%;
    margin-bottom:12px;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.low{
    border-left:6px solid #ff9800;
}

.critical{
    border-left:6px solid #f44336;
}

h3{
    margin:0 0 6px 0;
}

.small{
    font-size:13px;
    color:#666;
}

.row{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.row button{
    flex:1;
}

.green{
    background:#4caf50;
    color:white;
}

.red{
    background:#f44336;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
    box-sizing:border-box;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:14px;
    color:#666;
}

#preview{
    width:100%;
    border-radius:12px;
    margin-top:12px;
    display:none;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:white;
    border-radius:20px;
    padding:20px;
    width:100%;
    max-width:400px;
}

</style>
</head>
<body>

<header>
Supplement Inventory V3
</header>

<div class="container">

<button class="primary" onclick="document.getElementById('cameraInput').click()">
📷 拍照识别补剂
</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

<img id="preview">

<div class="status" id="status"></div>

<div id="inventory"></div>

</div>

<div class="modal" id="confirmModal">
    <div class="modal-content">

        <h2>确认补剂信息</h2>

        <input id="brandInput" placeholder="品牌">
        <input id="nameInput" placeholder="名称">
        <input id="dosageInput" placeholder="剂量">
        <input id="countInput" placeholder="规格/数量">
        <input id="stockInput" type="number" placeholder="库存数量">

        <button class="primary" onclick="saveSupplement()">
        保存入库
        </button>

    </div>
</div>

<script>

let inventory = JSON.parse(localStorage.getItem('supplementInventoryV3') || '[]');

function saveInventory(){
    localStorage.setItem('supplementInventoryV3', JSON.stringify(inventory));
}

function renderInventory(){

    const container = document.getElementById('inventory');

    inventory.sort((a,b)=>a.stock-b.stock);

    container.innerHTML = '';

    inventory.forEach((item,index)=>{

        let cls = '';

        if(item.stock <= 1){
            cls='critical';
        }else if(item.stock <= 2){
            cls='low';
        }

        container.innerHTML += `
        <div class="card ${cls}">
            <h3>${item.name}</h3>

            <div class="small">
            ${item.brand || ''}
            </div>

            <div class="small">
            ${item.dosage || ''}
            </div>

            <div class="small">
            ${item.count || ''}
            </div>

            <div style="margin-top:10px;font-weight:700;">
            库存：${item.stock}
            </div>

            <div class="row">
                <button class="green" onclick="changeStock(${index},1)">+1</button>
                <button class="red" onclick="changeStock(${index},-1)">-1</button>
            </div>
        </div>
        `;
    });
}

function changeStock(index,delta){

    inventory[index].stock += delta;

    if(inventory[index].stock < 0){
        inventory[index].stock = 0;
    }

    saveInventory();
    renderInventory();
}

document.getElementById('cameraInput').addEventListener('change', async function(e){

    const file = e.target.files[0];

    if(!file) return;

    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display='block';

    document.getElementById('status').innerText='正在识别文字...';

    try{

        const result = await Tesseract.recognize(
            file,
            'eng',
            {
                logger:m=>{
                    if(m.status){
                        document.getElementById('status').innerText =
                        m.status + ' ' + Math.round((m.progress||0)*100)+'%';
                    }
                }
            }
        );

        const text = result.data.text;

        console.log(text);

        parseSupplementText(text);

    }catch(err){

        console.error(err);

        document.getElementById('status').innerText='识别失败';

    }

});

function parseSupplementText(text){

    text = text.replace(/\n/g,' ');

    const brands = [
        'NOW',
        'NOW Foods',
        'Nutricost',
        'Life Extension',
        'Thorne',
        'Jarrow',
        'Doctor',
        'California Gold',
        'Sports Research'
    ];

    let brand='';

    for(const b of brands){

        if(text.toLowerCase().includes(b.toLowerCase())){
            brand=b;
            break;
        }
    }

    let dosageMatch = text.match(/\d+\s?(mg|mcg|g|IU)/i);

    let countMatch = text.match(/\d+\s?(Capsules|Softgels|Tablets|Caps|Veggie Capsules)/i);

    let dosage = dosageMatch ? dosageMatch[0] : '';

    let count = countMatch ? countMatch[0] : '';

    let possibleNames = [
        'TUDCA',
        'NMN',
        'TMG',
        'Magnesium',
        'Fish Oil',
        'Creatine',
        'Collagen',
        'Vitamin D',
        'Vitamin C',
        'Glycine',
        'Urolithin',
        'CoQ10'
    ];

    let name='';

    for(const n of possibleNames){

        if(text.toLowerCase().includes(n.toLowerCase())){
            name=n;
            break;
        }
    }

    document.getElementById('brandInput').value = brand;
    document.getElementById('nameInput').value = name;
    document.getElementById('dosageInput').value = dosage;
    document.getElementById('countInput').value = count;
    document.getElementById('stockInput').value = 1;

    document.getElementById('confirmModal').style.display='flex';

    document.getElementById('status').innerText='识别完成';

}

function saveSupplement(){

    const item = {
        brand:document.getElementById('brandInput').value,
        name:document.getElementById('nameInput').value,
        dosage:document.getElementById('dosageInput').value,
        count:document.getElementById('countInput').value,
        stock:parseInt(document.getElementById('stockInput').value || 1)
    };

    inventory.push(item);

    saveInventory();

    renderInventory();

    document.getElementById('confirmModal').style.display='none';

}

renderInventory();

</script>

</body>
</html>
