<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supplement Inventory</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #111;
  color: white;
}

header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 16px;
}

.card {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid #2d2d2d;
}

input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

input {
  background: #2c2c2e;
  color: white;
}

button {
  background: #0a84ff;
  color: white;
  font-weight: bold;
}

button.secondary {
  background: #2c2c2e;
}

.item-title {
  font-size: 18px;
  font-weight: bold;
}

.low {
  border-color: orange;
}

.critical {
  border-color: red;
}

.small {
  opacity: 0.7;
  font-size: 13px;
  margin-top: 6px;
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: white;
  padding: 12px 18px;
  border-radius: 14px;
  z-index: 9999;
  max-width: 85%;
  text-align: center;
}
</style>
</head>
<body>

<header>💊 Supplement Inventory</header>

<div class="container">

<div class="card">
<h3>📸 AI 拍照识别</h3>
<input type="file" accept="image/*" capture="environment" id="photoInput" />
<button onclick="scanPhoto()">识别补剂</button>
</div>

<div class="card">
<h3>⚙️ Gemini API Key</h3>
<input type="password" id="apiKeyInput" placeholder="输入 Gemini API Key" />
<button class="secondary" onclick="saveApiKey()">保存 API Key</button>
</div>

<div class="card">
<h3>➕ 手动添加</h3>
<input id="manualName" placeholder="补剂名称" />
<input id="manualBrand" placeholder="品牌" />
<input id="manualDosage" placeholder="规格" />
<input id="manualAmount" type="number" placeholder="库存数量" />
<input id="manualDaily" type="number" placeholder="每日用量" />
<button onclick="addManualItem()">添加库存</button>
</div>

<div id="inventory"></div>

</div>

<script>

let inventory = JSON.parse(localStorage.getItem('inventory') || '[]');

function saveInventory() {
  localStorage.setItem('inventory', JSON.stringify(inventory));
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerText = message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 2200);
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();

  if (!key) {
    showToast('请输入 API Key');
    return;
  }

  localStorage.setItem('gemini_api_key', key);
  showToast('API Key 已保存');
}

function calculateDays(item) {
  if (!item.dailyDose || item.dailyDose <= 0) return null;
  return Math.floor(item.amount / item.dailyDose);
}

function inventoryLevel(days) {
  if (days === null) return '';
  if (days <= 7) return 'critical';
  if (days <= 30) return 'low';
  return '';
}

function renderInventory() {
  const div = document.getElementById('inventory');

  inventory.sort((a,b) => {
    const da = calculateDays(a) || 9999;
    const db = calculateDays(b) || 9999;
    return da - db;
  });

  div.innerHTML = '';

  inventory.forEach((item, index) => {

    const days = calculateDays(item);

    const card = document.createElement('div');
    card.className = `card ${inventoryLevel(days)}`;

    card.innerHTML = `
      <div class="item-title">${item.name || '-'} </div>
      <div>${item.brand || '-'}</div>
      <div class="small">${item.dosage || '-'}</div>
      <div class="small">库存：${item.amount || 0}</div>
      <div class="small">每日：${item.dailyDose || '-'}</div>
      <div class="small">剩余天数：${days || '-'}</div>

      <button onclick="consumeItem(${index})">消耗 1</button>
      <button class="secondary" onclick="deleteItem(${index})">删除</button>
    `;

    div.appendChild(card);
  });
}

function consumeItem(index) {
  if (inventory[index].amount > 0) {
    inventory[index].amount -= 1;
    saveInventory();
    renderInventory();
  }
}

function deleteItem(index) {
  if (confirm('确认删除？')) {
    inventory.splice(index, 1);
    saveInventory();
    renderInventory();
  }
}

function addManualItem() {
  const item = {
    name: document.getElementById('manualName').value,
    brand: document.getElementById('manualBrand').value,
    dosage: document.getElementById('manualDosage').value,
    amount: parseInt(document.getElementById('manualAmount').value || '0'),
    dailyDose: parseInt(document.getElementById('manualDaily').value || '0')
  };

  inventory.push(item);
  saveInventory();
  renderInventory();

  showToast('添加成功');
}

async function compressImage(file, maxWidth = 1280, quality = 0.72) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
      img.src = e.target.result;
    };

    img.onload = () => {
      const canvas = document.createElement('canvas');

      let width = img.width;
      let height = img.height;

      if (width > maxWidth) {
        height *= maxWidth / width;
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(
        (blob) => {
          resolve(blob);
        },
        'image/jpeg',
        quality
      );
    };

    reader.readAsDataURL(file);
  });
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      resolve(reader.result.split(',')[1]);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

async function scanPhoto() {

  try {

    const apiKey = localStorage.getItem('gemini_api_key');

    if (!apiKey) {
      showToast('请先保存 API Key');
      return;
    }

    const file = document.getElementById('photoInput').files[0];

    if (!file) {
      showToast('请先选择照片');
      return;
    }

    showToast('压缩图片中...');

    const compressed = await compressImage(file);

    const base64 = await fileToBase64(compressed);

    showToast('AI识别中...');

    const prompt = `
你是专业补剂识别系统。

请识别图片中的营养补剂。

严格要求：
1. 只返回 JSON
2. 不要 markdown
3. 不要解释
4. 不要额外文字

格式：
{
  "brand": "品牌",
  "name": "产品名",
  "dosage": "规格",
  "count": "数量"
}
`;

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: prompt
                },
                {
                  inline_data: {
                    mime_type: 'image/jpeg',
                    data: base64
                  }
                }
              ]
            }
          ],
          generationConfig: {
            temperature: 0.1,
            topK: 1,
            topP: 0.8,
            maxOutputTokens: 300
          }
        })
      }
    );

    const data = await res.json();

    console.log(data);

    if (!res.ok) {
      throw new Error(data?.error?.message || 'API错误');
    }

    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

    text = text
      .replace(/```json/g, '')
      .replace(/```/g, '')
      .trim();

    const match = text.match(/\{[\s\S]*\}/);

    if (!match) {
      throw new Error('无法解析 AI 返回');
    }

    let cleaned = match[0]
      .replace(/,\s*}/g, '}')
      .replace(/,\s*]/g, ']')
      .trim();

    let result;

    try {
      result = JSON.parse(cleaned);
    } catch (e) {
      console.error('JSON parse failed:', cleaned);

      const brandMatch = cleaned.match(/\"brand\"\s*:\s*\"([^\"]*)\"/i);
      const nameMatch = cleaned.match(/\"name\"\s*:\s*\"([^\"]*)\"/i);
      const dosageMatch = cleaned.match(/\"dosage\"\s*:\s*\"([^\"]*)\"/i);
      const countMatch = cleaned.match(/\"count\"\s*:\s*\"([^\"]*)\"/i);

      result = {
        brand: brandMatch ? brandMatch[1] : '',
        name: nameMatch ? nameMatch[1] : '',
        dosage: dosageMatch ? dosageMatch[1] : '',
        count: countMatch ? countMatch[1] : ''
      };

      if (!result.name && !result.brand) {
        throw new Error('AI 返回格式异常');
      }
    }

    const ok = confirm(
`品牌: ${result.brand || '-'}
产品: ${result.name || '-'}
规格: ${result.dosage || '-'}
数量: ${result.count || '-'}

确认添加库存？`
    );

    if (!ok) return;

    inventory.push({
      brand: result.brand || '',
      name: result.name || '',
      dosage: result.dosage || '',
      amount: 1,
      dailyDose: 1
    });

    saveInventory();
    renderInventory();

    showToast('识别成功');

  } catch (err) {

    console.error(err);

    let message = err.message || '识别失败';

    if (message.includes('quota')) {
      message = 'Gemini 免费额度已用完';
    }

    if (message.includes('API_KEY')) {
      message = 'API Key 无效';
    }

    showToast(message);
  }
}

renderInventory();

</script>

</body>
</html>
