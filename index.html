<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>补剂库存管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2128;
    --border: #2a2d35;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --warn: #f0a060;
    --danger: #f06060;
    --text: #e8eaf0;
    --muted: #6b7080;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif; min-height: 100vh; padding-bottom: 100px; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 20px 16px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .stats-row { display: flex; gap: 10px; }
  .stat-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .stat-chip .num { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
  .stat-chip.warn .num { color: var(--warn); }
  .stat-chip.ok .num { color: var(--accent); }

  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }

  .section-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; margin-top: 20px; }
  .section-title:first-child { margin-top: 4px; }

  .alert-banner { background: linear-gradient(135deg, #2a1a0a, #1e1208); border: 1px solid var(--warn); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .alert-banner strong { color: var(--warn); }

  .supp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.2s; }
  .supp-card.warn { border-color: #3a2010; background: linear-gradient(135deg, #1e1610, #16181c); }
  .supp-card.critical { border-color: var(--danger); background: linear-gradient(135deg, #2a1010, #16181c); }
  .supp-card.plenty { opacity: 0.65; }

  .supp-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .supp-info { flex: 1; min-width: 0; }
  .supp-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .supp-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .supp-right { text-align: right; flex-shrink: 0; }
  .supp-stock { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 2px; }
  .supp-stock.critical { color: var(--danger); }
  .supp-stock.warn { color: var(--warn); }
  .supp-stock.ok { color: var(--accent); }
  .supp-stock.plenty { color: var(--muted); }
  .supp-unit { font-size: 11px; color: var(--muted); }

  .scan-area { background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 20px; text-align: center; margin-bottom: 16px; }
  .scan-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #0e0f11; border: none; border-radius: 12px; padding: 13px 26px; font-size: 15px; font-weight: 700; font-family: 'Sora', sans-serif; cursor: pointer; }
  .scan-hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

  #scanner-container { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; margin-bottom: 16px; display: none; }
  #scanner-container video, #scanner-container canvas { width: 100% !important; height: auto !important; display: block; }
  #scanner-video { width: 100%; display: block; }
  .scan-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame { width: 240px; height: 120px; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
  .scan-line { position: absolute; width: 100%; height: 2px; background: var(--accent); animation: scanline 2s ease-in-out infinite; }
  @keyframes scanline { 0%,100% { top:10%; opacity:.8; } 50% { top:85%; opacity:1; } }
  .stop-scan-btn { width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; margin-bottom: 16px; }
  .lookup-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; display: none; }
  .lookup-card.show { display: block; }
  .lookup-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .lookup-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .toolbar { display: flex; gap: 8px; margin-top: 12px; }
  .btn-secondary { flex: 1; padding: 12px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; }
  .btn-secondary.accent { border-color: var(--accent); color: var(--accent); }
  .btn-secondary.warn { border-color: var(--warn); color: var(--warn); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }
  input, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px; font-family: 'Sora', sans-serif; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  input:focus, select:focus { border-color: var(--accent2); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: #0e0f11; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: 'Sora', sans-serif; cursor: pointer; margin-top: 8px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 10px 0 20px; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0; border: none; background: transparent; color: var(--muted); font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 600; }
  .nav-item .nav-icon { font-size: 22px; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; font-family: 'DM Mono', monospace; line-height: 1.5; }

  /* Modal tabs */
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .modal-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: 'Sora', sans-serif; }
  .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .modal-tab-content { display: none; }
  .modal-tab-content.active { display: block; }

  /* Stock display */
  .stock-display { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 20px 0 8px; }
  .stock-big { font-family: 'DM Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1; }
  .stock-big.critical { color: var(--danger); }
  .stock-big.warn { color: var(--warn); }
  .stock-big.ok { color: var(--accent); }
  .stock-big.plenty { color: var(--muted); }
  .adj-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface2); color: var(--text); font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .adj-btn:active { transform: scale(0.9); }

  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-outline { flex: 1; padding: 11px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; }
  .btn-fill { flex: 1; padding: 11px; background: var(--accent); color: #0e0f11; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Sora', sans-serif; }
  .btn-danger-full { width: 100%; padding: 12px; background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; margin-top: 16px; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.info { border-color: var(--accent2); color: var(--accent2); }

  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .filter-chip.active { background: var(--accent); color: #0e0f11; border-color: var(--accent); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 18px; }
  .settings-card p { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 6px; }

  select option { background: var(--surface2); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">补剂<span>库存</span></div>
    <div class="stats-row">
      <div class="stat-chip ok"><span>总计</span><span class="num" id="total-count">0</span></div>
      <div class="stat-chip warn"><span>⚠️ 补货</span><span class="num" id="warn-count">0</span></div>
    </div>
  </div>
</div>

<!-- 库存页 -->
<div class="page active" id="page-home">
  <div id="alert-section"></div>
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterBy('全部',this)">全部</div>
    <div class="filter-chip" onclick="filterBy('甲基化',this)">甲基化</div>
    <div class="filter-chip" onclick="filterBy('线粒体',this)">线粒体</div>
    <div class="filter-chip" onclick="filterBy('抗氧化',this)">抗氧化</div>
    <div class="filter-chip" onclick="filterBy('肠道',this)">肠道</div>
    <div class="filter-chip" onclick="filterBy('矿物质',this)">矿物质</div>
    <div class="filter-chip" onclick="filterBy('其他',this)">其他</div>
  </div>
  <div id="inventory-list"></div>
</div>

<!-- 入库页 -->
<div class="page" id="page-scan">
  <div class="section-title">扫码入库</div>
  <div class="scan-area" id="scan-area">
    <div style="font-size:44px;margin-bottom:14px">📷</div>
    <button class="scan-btn" onclick="startScan()"><span>扫描条形码</span></button>
    <div class="toolbar">
      <button class="btn-secondary accent" onclick="document.getElementById('barcode-photo').click()">拍照识别条码</button>
    </div>
    <input id="barcode-photo" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanBarcodeImage(event)" />
    <div class="scan-hint">iPhone Safari 如果实时扫码失败，请用“拍照识别条码”</div>
  </div>
  <div id="scanner-container">
    <video id="scanner-video" autoplay muted playsinline></video>
    <div class="scan-overlay"><div class="scan-frame"><div class="scan-line"></div></div></div>
  </div>
  <button class="stop-scan-btn" id="stop-btn" style="display:none" onclick="stopScan()">停止扫描</button>
  <div class="lookup-card" id="lookup-card">
    <div class="lookup-title" id="lookup-title">条码识别</div>
    <div class="lookup-text" id="lookup-text"></div>
  </div>

  <div class="divider">手动填写</div>

  <div class="input-group">
    <label class="input-label">条形码</label>
    <input type="text" id="add-barcode" placeholder="扫码后自动填入，也可手动输入" inputmode="numeric" />
    <div class="toolbar">
      <button class="btn-secondary accent" onclick="lookupBarcodeFromInput()">查询商品信息</button>
      <button class="btn-secondary" onclick="clearBarcode()">清空条码</button>
    </div>
  </div>

  <div class="input-group">
    <label class="input-label">补剂名称 *</label>
    <input type="text" id="add-name" placeholder="例：NMN、TMG、镁甘氨酸" />
  </div>
  <div class="input-group">
    <label class="input-label">品牌</label>
    <input type="text" id="add-brand" placeholder="例：Life Extension、NOW Foods" />
  </div>
  <div class="input-group">
    <label class="input-label">分类</label>
    <select id="add-category">
      <option value="甲基化">甲基化</option>
      <option value="线粒体">线粒体</option>
      <option value="抗氧化">抗氧化</option>
      <option value="肠道">肠道</option>
      <option value="矿物质">矿物质</option>
      <option value="其他" selected>其他</option>
    </select>
  </div>
  <div class="row-2">
    <div class="input-group">
      <label class="input-label">当前库存数量</label>
      <input type="number" id="add-stock" placeholder="例：3" min="0" value="1" />
    </div>
    <div class="input-group">
      <label class="input-label">补货阈值</label>
      <input type="number" id="add-threshold" placeholder="例：1" min="0" value="1" />
    </div>
  </div>
  <div class="input-group">
      <label class="input-label">单位</label>
      <select id="add-unit">
        <option value="瓶">瓶</option>
        <option value="罐">罐</option>
        <option value="袋">袋</option>
        <option value="盒">盒</option>
        <option value="支">支</option>
        <option value="ml">ml</option>
        <option value="个">个</option>
      </select>
  </div>
  <div class="input-group">
    <label class="input-label">规格备注</label>
    <input type="text" id="add-spec" placeholder="例：500mg × 60粒/瓶" />
  </div>
  <button class="btn-primary" onclick="addSupplement()">➕ 添加到库存</button>
</div>

<!-- 补货清单页 -->
<div class="page" id="page-shopping">
  <div class="section-title">需要补货（低于各自阈值）</div>
  <div id="shopping-list"></div>

  <div class="section-title">数据备份</div>
  <div class="settings-card">
    <div class="lookup-title">导出 / 导入库存</div>
    <p>数据保存在当前浏览器。建议偶尔导出备份，换手机或清理浏览器前尤其有用。</p>
    <div class="toolbar">
      <button class="btn-secondary accent" onclick="exportData()">导出备份</button>
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>
    <input id="import-file" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)" />
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="showPage('home',this)">
    <span class="nav-icon">📦</span><span>库存</span>
  </button>
  <button class="nav-item" onclick="showPage('scan',this)">
    <span class="nav-icon">➕</span><span>入库</span>
  </button>
  <button class="nav-item" onclick="showPage('shopping',this)">
    <span class="nav-icon">🛒</span><span>补货清单</span>
  </button>
</div>

<!-- 详情/编辑 Modal -->
<div class="modal-overlay" id="detail-modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-name"></div>
    <div class="modal-sub" id="modal-sub"></div>

    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('stock')">📦 库存调整</button>
      <button class="modal-tab" onclick="switchTab('edit')">✏️ 编辑信息</button>
    </div>

    <!-- 库存调整 tab -->
    <div class="modal-tab-content active" id="tab-stock">
      <div class="stock-display">
        <button class="adj-btn" onclick="quickAdj(-1)">−</button>
        <div style="text-align:center">
          <div class="stock-big" id="modal-stock-num">0</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px" id="modal-stock-unit"></div>
        </div>
        <button class="adj-btn" onclick="quickAdj(1)">+</button>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:16px">点 +/− 每次调整 1 个包装单位</div>

      <div class="input-group">
        <label class="input-label">批量入库 / 出库</label>
        <input type="number" id="modal-adjust" placeholder="输入数量" min="1" />
      </div>
      <div class="btn-row">
        <button class="btn-outline" onclick="adjustStock(-1)">− 出库</button>
        <button class="btn-fill" onclick="adjustStock(1)">+ 入库</button>
      </div>
      <button class="btn-danger-full" onclick="deleteItem()">删除此补剂</button>
    </div>

    <!-- 编辑信息 tab -->
    <div class="modal-tab-content" id="tab-edit">
      <div class="input-group">
        <label class="input-label">补剂名称</label>
        <input type="text" id="edit-name" />
      </div>
      <div class="input-group">
        <label class="input-label">品牌</label>
        <input type="text" id="edit-brand" />
      </div>
      <div class="input-group">
        <label class="input-label">分类</label>
        <select id="edit-category">
          <option value="甲基化">甲基化</option>
          <option value="线粒体">线粒体</option>
          <option value="抗氧化">抗氧化</option>
          <option value="肠道">肠道</option>
          <option value="矿物质">矿物质</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">单位</label>
        <select id="edit-unit">
          <option value="瓶">瓶</option>
          <option value="罐">罐</option>
          <option value="袋">袋</option>
          <option value="盒">盒</option>
          <option value="支">支</option>
          <option value="ml">ml</option>
          <option value="个">个</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">补货阈值</label>
        <input type="number" id="edit-threshold" min="0" />
      </div>
      <div class="input-group">
        <label class="input-label">规格备注</label>
        <input type="text" id="edit-spec" placeholder="例：500mg × 60粒/瓶" />
      </div>
      <button class="btn-primary" onclick="saveEdit()">💾 保存修改</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let inventory = safeParseInventory(localStorage.getItem('supp_inventory'));
let currentFilter = '全部';
let activeItemId = null;
let scanStream = null;
let scanTimer = null;
let barcodeDetector = null;
let zxingControls = null;
let zxingLoading = null;

const CATEGORY_ICONS = { '甲基化':'🧬', '线粒体':'⚡', '抗氧化':'🛡️', '肠道':'🌿', '矿物质':'💎', '其他':'💊' };
const UNITS = ['瓶','罐','袋','盒','支','ml','个'];
const BARCODE_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39'];
const ZXING_CDN = 'https://unpkg.com/@zxing/browser@0.2.0/umd/zxing-browser.min.js';

function safeParseInventory(raw) {
  try {
    const parsed = JSON.parse(raw || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch(e) {
    return [];
  }
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function escapeAttr(value) {
  return escapeHTML(value).replace(/`/g, '&#96;');
}

function normalizeItem(item) {
  const stock = parseInt(item.stock);
  const threshold = parseInt(item.threshold);
  return {
    id: String(item.id || makeId()),
    name: String(item.name || '').trim(),
    brand: String(item.brand || '').trim(),
    category: CATEGORY_ICONS[item.category] ? item.category : '其他',
    stock: isNaN(stock) || stock < 0 ? 0 : stock,
    threshold: isNaN(threshold) || threshold < 0 ? 1 : threshold,
    unit: UNITS.includes(item.unit) ? item.unit : '瓶',
    spec: String(item.spec || '').trim(),
    barcode: String(item.barcode || '').trim(),
    addedAt: item.addedAt || new Date().toLocaleDateString('zh-CN')
  };
}

function save() { localStorage.setItem('supp_inventory', JSON.stringify(inventory)); }

// 状态逻辑：基于包装数量
// 0 = critical（红）, 低于/等于阈值 = warn（橙）, 阈值以上 = ok, 5+ 且明显超过阈值 = plenty（灰）
function getStatus(item) {
  if (item.stock === 0) return 'critical';
  const threshold = Number.isFinite(item.threshold) ? item.threshold : 1;
  if (item.stock <= threshold) return 'warn';
  if (item.stock >= Math.max(5, threshold + 4)) return 'plenty';
  return 'ok';
}

function render() { renderInventory(); renderAlerts(); renderShopping(); updateStats(); }

function updateStats() {
  document.getElementById('total-count').textContent = inventory.length;
  document.getElementById('warn-count').textContent = inventory.filter(i => getStatus(i) === 'warn' || getStatus(i) === 'critical').length;
}

function renderInventory() {
  const list = document.getElementById('inventory-list');
  let items = currentFilter === '全部' ? inventory : inventory.filter(i => i.category === currentFilter);
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">' + (currentFilter==='全部'?'📦':CATEGORY_ICONS[currentFilter]||'💊') + '</div><p>' + (currentFilter==='全部'?'还没有添加任何补剂<br>点击下方 ➕ 开始入库':'这个分类暂无补剂') + '</p></div>';
    return;
  }
  const order = {critical:0, warn:1, ok:2, plenty:3};
  items = [...items].sort((a,b) => order[getStatus(a)] - order[getStatus(b)]);

  list.innerHTML = items.map(item => {
    const st = getStatus(item);
    const unit = item.unit || '瓶';
    const icon = CATEGORY_ICONS[item.category] || '💊';
    const badge = st==='critical' ? '<div class="supp-meta" style="margin-top:3px;color:var(--danger)">🚨 已用完</div>'
                : st==='warn'     ? '<div class="supp-meta" style="margin-top:3px;color:var(--warn)">⚠️ 低于补货阈值 '+escapeHTML(item.threshold)+' '+escapeHTML(unit)+'</div>'
                : st==='plenty'   ? '<div class="supp-meta" style="margin-top:3px;color:var(--muted)">库存充足</div>'
                : '';
    return '<div class="supp-card '+st+'" data-id="'+escapeAttr(item.id)+'" onclick="openDetailFromCard(this)">'
      + '<div class="supp-icon">'+icon+'</div>'
      + '<div class="supp-info">'
      +   '<div class="supp-name">'+escapeHTML(item.name)+'</div>'
      +   '<div class="supp-meta">'+escapeHTML(item.brand||'—')+' · '+escapeHTML(item.spec||item.category)+'</div>'
      +   badge
      + '</div>'
      + '<div class="supp-right">'
      +   '<div class="supp-stock '+st+'">'+escapeHTML(item.stock)+'</div>'
      +   '<div class="supp-unit">'+escapeHTML(unit)+'</div>'
      + '</div>'
      + '</div>';
  }).join('');
}

function renderAlerts() {
  const n = inventory.filter(i => getStatus(i)==='warn'||getStatus(i)==='critical').length;
  document.getElementById('alert-section').innerHTML = n===0 ? '' :
    '<div class="alert-banner"><span>⚠️</span><span>有 <strong>'+n+' 种</strong>补剂需要补货</span></div>';
}

function renderShopping() {
  const list = document.getElementById('shopping-list');
  const items = inventory.filter(i => getStatus(i)==='warn'||getStatus(i)==='critical').sort((a,b)=>a.stock-b.stock);
  if (items.length===0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">✅</div><p>所有补剂库存充足<br>暂不需要补货</p></div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const st = getStatus(item);
    const unit = item.unit||'瓶';
    const icon = CATEGORY_ICONS[item.category]||'💊';
    return '<div class="supp-card '+st+'" data-id="'+escapeAttr(item.id)+'" onclick="openDetailFromCard(this)">'
      + '<div class="supp-icon">'+icon+'</div>'
      + '<div class="supp-info">'
      +   '<div class="supp-name">'+escapeHTML(item.name)+'</div>'
      +   '<div class="supp-meta">'+escapeHTML(item.brand||'—')+(item.spec?' · '+escapeHTML(item.spec):'')+'</div>'
      +   '<div class="supp-meta" style="margin-top:3px;color:'+(st==='critical'?'var(--danger)':'var(--warn)')+'">'+
            (st==='critical'?'🚨 已用完，需要购买':'⚠️ 剩余 '+escapeHTML(item.stock)+' '+escapeHTML(unit)+'，低于阈值 '+escapeHTML(item.threshold))+'</div>'
      + '</div>'
      + '<div class="supp-right"><div class="supp-stock '+st+'">'+escapeHTML(item.stock)+'</div><div class="supp-unit">'+escapeHTML(unit)+'</div></div>'
      + '</div>';
  }).join('');
}

function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if (name!=='scan') stopScan();
}

function filterBy(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderInventory();
}

function openDetailFromCard(el) {
  openDetail(el.dataset.id);
}

function addSupplement() {
  const name = document.getElementById('add-name').value.trim();
  const stock = parseInt(document.getElementById('add-stock').value);
  const threshold = parseInt(document.getElementById('add-threshold').value);
  if (!name) { showToast('请填写补剂名称','error'); return; }
  if (isNaN(stock)||stock<0) { showToast('请填写有效库存数量','error'); return; }
  if (isNaN(threshold)||threshold<0) { showToast('请填写有效补货阈值','error'); return; }
  const item = {
    id: makeId(), name,
    brand: document.getElementById('add-brand').value.trim(),
    category: document.getElementById('add-category').value,
    stock, threshold, unit: document.getElementById('add-unit').value,
    spec: document.getElementById('add-spec').value.trim(),
    barcode: document.getElementById('add-barcode').value.trim(),
    addedAt: new Date().toLocaleDateString('zh-CN')
  };
  inventory.push(item); save(); render();
  ['add-name','add-brand','add-spec','add-barcode'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('add-stock').value='1';
  document.getElementById('add-threshold').value='1';
  hideLookupCard();
  showToast('✅ '+name+' 已入库','success');
  showPage('home', document.querySelector('.nav-item'));
}

function openDetail(id) {
  activeItemId = id;
  const item = inventory.find(i=>i.id===id);
  if (!item) return;
  const st = getStatus(item);
  const unit = item.unit||'瓶';
  document.getElementById('modal-name').textContent = item.name;
  document.getElementById('modal-sub').textContent = (item.brand||'未知品牌')+' · '+item.category+(item.spec?' · '+item.spec:'')+(item.barcode?' · 条码 '+item.barcode:'')+'\n入库时间：'+item.addedAt+' · 补货阈值：'+item.threshold+(item.unit||'瓶');
  const numEl = document.getElementById('modal-stock-num');
  numEl.textContent = item.stock; numEl.className = 'stock-big '+st;
  document.getElementById('modal-stock-unit').textContent = unit;
  document.getElementById('modal-adjust').value = '';
  // prefill edit tab
  document.getElementById('edit-name').value = item.name;
  document.getElementById('edit-brand').value = item.brand||'';
  document.getElementById('edit-category').value = item.category||'其他';
  document.getElementById('edit-unit').value = UNITS.includes(unit)?unit:'瓶';
  document.getElementById('edit-threshold').value = item.threshold ?? 1;
  document.getElementById('edit-spec').value = item.spec||'';
  switchTab('stock');
  document.getElementById('detail-modal').classList.add('show');
}

function switchTab(tab) {
  document.querySelectorAll('.modal-tab').forEach((t,i)=>t.classList.toggle('active',['stock','edit'][i]===tab));
  document.getElementById('tab-stock').classList.toggle('active',tab==='stock');
  document.getElementById('tab-edit').classList.toggle('active',tab==='edit');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('show'); activeItemId=null; }

function quickAdj(dir) {
  const item = inventory.find(i=>i.id===activeItemId);
  if (!item) return;
  item.stock = Math.max(0, item.stock+dir);
  save(); render();
  const st = getStatus(item);
  const numEl = document.getElementById('modal-stock-num');
  numEl.textContent = item.stock; numEl.className = 'stock-big '+st;
}

function adjustStock(dir) {
  const amount = parseInt(document.getElementById('modal-adjust').value);
  if (isNaN(amount)||amount<=0) { showToast('请输入有效数量','error'); return; }
  const item = inventory.find(i=>i.id===activeItemId);
  if (!item) return;
  item.stock = Math.max(0, item.stock+dir*amount);
  save(); render(); closeModal();
  showToast((dir>0?'✅ 入库 ':'📤 出库 ')+amount+'，'+item.name+' 剩余 '+item.stock+(item.unit||'瓶'),'success');
}

function saveEdit() {
  const item = inventory.find(i=>i.id===activeItemId);
  if (!item) return;
  const name = document.getElementById('edit-name').value.trim();
  const threshold = parseInt(document.getElementById('edit-threshold').value);
  if (!name) { showToast('名称不能为空','error'); return; }
  if (isNaN(threshold)||threshold<0) { showToast('请填写有效补货阈值','error'); return; }
  item.name=name;
  item.brand=document.getElementById('edit-brand').value.trim();
  item.category=document.getElementById('edit-category').value;
  item.unit=document.getElementById('edit-unit').value;
  item.threshold=threshold;
  item.spec=document.getElementById('edit-spec').value.trim();
  save(); render();
  document.getElementById('modal-name').textContent=item.name;
  document.getElementById('modal-sub').textContent=(item.brand||'未知品牌')+' · '+item.category+(item.spec?' · '+item.spec:'')+(item.barcode?' · 条码 '+item.barcode:'')+'\n入库时间：'+item.addedAt+' · 补货阈值：'+item.threshold+(item.unit||'瓶');
  document.getElementById('modal-stock-unit').textContent=item.unit||'瓶';
  switchTab('stock');
  showToast('✅ 信息已更新','success');
}

function deleteItem() {
  const item = inventory.find(i=>i.id===activeItemId);
  if (!item||!confirm('确定删除「'+item.name+'」吗？')) return;
  inventory=inventory.filter(i=>i.id!==activeItemId);
  save(); render(); closeModal();
  showToast('已删除 '+item.name,'error');
}

// 扫码与条码查询
let scanning = false;
async function startScan() {
  if (!('BarcodeDetector' in window)) {
    await startZxingScan();
    return;
  }

  try {
    barcodeDetector = new BarcodeDetector({ formats: BARCODE_FORMATS });
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.getElementById('scanner-video');
    video.srcObject = scanStream;
    await video.play();
    document.getElementById('scanner-container').style.display='block';
    document.getElementById('stop-btn').style.display='block';
    document.getElementById('scan-area').style.display='none';
    scanning = true;
    showLookupCard('正在扫描', '请把条形码放进取景框内，保持 1-2 秒。');
    scanLoop();
  } catch(e) {
    stopScan();
    showLookupCard('无法打开摄像头', '请确认浏览器允许相机权限，或者手动输入条形码查询。');
    showToast('无法访问摄像头','error');
  }
}

async function startZxingScan() {
  try {
    await loadZxing();
    const video = document.getElementById('scanner-video');
    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    document.getElementById('scanner-container').style.display='block';
    document.getElementById('stop-btn').style.display='block';
    document.getElementById('scan-area').style.display='none';
    scanning = true;
    showLookupCard('正在使用备用扫码', '请把条形码放进取景框内。首次加载备用扫码引擎需要联网。');
    zxingControls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      video,
      (result) => {
        if (!result || !scanning) return;
        handleBarcode(result.getText ? result.getText() : result.text);
      }
    );
  } catch(e) {
    stopScan();
    showLookupCard('此浏览器暂不支持扫码', '备用扫码引擎也没能启动。你仍然可以手动输入条形码后点“查询商品信息”。如果在手机上使用，建议通过 GitHub Pages 的 https 链接打开。');
    showToast('扫码启动失败','error');
    document.getElementById('add-barcode').focus();
  }
}

async function scanBarcodeImage(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    await loadZxing();
    showLookupCard('正在识别照片', '如果一次没识别到，可以让条码占满画面再拍一张。');
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async () => {
      try {
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        const result = await reader.decodeFromImageElement(img);
        URL.revokeObjectURL(url);
        event.target.value = '';
        await handleBarcode(result.getText ? result.getText() : result.text);
      } catch(e) {
        URL.revokeObjectURL(url);
        event.target.value = '';
        showLookupCard('照片里没有识别到条码', '请让条形码更清晰、更大一些，避免反光，然后再拍一次。也可以直接手动输入条码。');
        showToast('没有识别到条码','error');
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      event.target.value = '';
      showLookupCard('照片读取失败', '请重新拍照，或者手动输入条码。');
      showToast('照片读取失败','error');
    };
    img.src = url;
  } catch(e) {
    event.target.value = '';
    showLookupCard('无法加载拍照识别', '请确认当前页面可以联网加载备用扫码引擎，或者先手动输入条码。');
    showToast('拍照识别不可用','error');
  }
}

function loadZxing() {
  if (window.ZXingBrowser) return Promise.resolve();
  if (zxingLoading) return zxingLoading;
  zxingLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = ZXING_CDN;
    s.async = true;
    s.onload = () => window.ZXingBrowser ? resolve() : reject(new Error('ZXing 未加载'));
    s.onerror = () => reject(new Error('ZXing 加载失败'));
    document.head.appendChild(s);
  });
  return zxingLoading;
}

async function scanLoop() {
  if (!scanning || !barcodeDetector) return;
  const video = document.getElementById('scanner-video');
  try {
    const codes = await barcodeDetector.detect(video);
    if (codes && codes.length > 0) {
      await handleBarcode(codes[0].rawValue);
      return;
    }
  } catch(e) {}
  scanTimer = setTimeout(scanLoop, 450);
}

function stopScan() {
  if(scanTimer) clearTimeout(scanTimer);
  scanTimer = null;
  if (zxingControls && zxingControls.stop) {
    try { zxingControls.stop(); } catch(e) {}
  }
  zxingControls = null;
  scanning=false;
  const video = document.getElementById('scanner-video');
  if (video) video.srcObject = null;
  if (scanStream) scanStream.getTracks().forEach(track=>track.stop());
  scanStream = null;
  document.getElementById('scanner-container').style.display='none';
  document.getElementById('stop-btn').style.display='none';
  document.getElementById('scan-area').style.display='block';
}

async function handleBarcode(code) {
  const cleanCode = String(code || '').trim();
  if (!cleanCode) return;
  stopScan();
  document.getElementById('add-barcode').value = cleanCode;
  const existing = inventory.find(i => i.barcode === cleanCode);
  if (existing) {
    showLookupCard('已在库存中找到', '这个条码已经对应「'+existing.name+'」。我已打开它的库存详情。');
    openDetail(existing.id);
    return;
  }
  showToast('📷 已识别条码 '+cleanCode,'info');
  await lookupBarcode(cleanCode);
}

function lookupBarcodeFromInput() {
  const code = document.getElementById('add-barcode').value.trim();
  if (!code) { showToast('请先输入条形码','error'); return; }
  handleBarcode(code);
}

function clearBarcode() {
  document.getElementById('add-barcode').value = '';
  hideLookupCard();
}

async function lookupBarcode(code) {
  showLookupCard('正在查询商品信息', '条码：'+code+'。如果公开数据库没有收录，仍然可以手动填写。');
  const fields = 'product_name,brands,quantity,serving_size,categories,categories_tags';
  const lookupUrls = [
    'https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields,
    'https://world.openproductsfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields,
    'https://world.openbeautyfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields
  ];
  let hadNetworkError = false;

  for (const url of lookupUrls) {
    const data = await fetchProductInfo(url).catch(() => {
      hadNetworkError = true;
      return null;
    });
    if (data && data.product) {
      applyProductInfo(data.product, code);
      return;
    }
  }

  document.getElementById('add-spec').value = mergeSpecWithBarcode(document.getElementById('add-spec').value, code);
  document.getElementById('add-name').focus();
  if (hadNetworkError) {
    showLookupCard('没能连接商品数据库', '已保留条码 '+code+'。这通常是网络、Safari 隐私限制或数据库临时不可达导致。你仍然可以手动填写并保存，下次扫这个条码会直接打开本地库存项。');
  } else {
    showLookupCard('公开数据库没有收录', '已保留条码 '+code+'。请手动填写名称、品牌和规格；保存后，这个条码就会成为你自己的本地识别记录。');
  }
}

async function fetchProductInfo(url) {
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 10000);
  try {
    const res = await fetch(url, { signal: controller.signal, mode: 'cors', cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function applyProductInfo(product, code) {
  const name = product.product_name || '';
  const brand = product.brands || '';
  const spec = product.quantity || product.serving_size || '';
  if (name) document.getElementById('add-name').value = name;
  if (brand) document.getElementById('add-brand').value = brand.split(',')[0].trim();
  if (spec) document.getElementById('add-spec').value = mergeSpecWithBarcode(spec, code);
  else document.getElementById('add-spec').value = mergeSpecWithBarcode(document.getElementById('add-spec').value, code);
  document.getElementById('add-category').value = inferCategory(product);
  showLookupCard('已自动填入商品信息', (name || '未命名商品') + (brand ? ' · ' + brand : '') + (spec ? ' · ' + spec : ''));
  showToast('已找到商品信息','success');
  document.getElementById('add-stock').focus();
}

function inferCategory(product) {
  const text = ((product.categories || '') + ' ' + ((product.categories_tags || []).join(' ')) + ' ' + (product.product_name || '')).toLowerCase();
  if (/magnesium|zinc|iron|calcium|minerals?|镁|锌|铁|钙/.test(text)) return '矿物质';
  if (/probiotic|prebiotic|fiber|gut|益生菌|益生元|肠道/.test(text)) return '肠道';
  if (/omega|fish oil|coq10|q10|nmn|nad|mitochondria|鱼油|辅酶/.test(text)) return '线粒体';
  if (/glutathione|vitamin c|antioxidant|resveratrol|抗氧化/.test(text)) return '抗氧化';
  if (/methyl|b12|folate|tmg|sam-e|甲基|叶酸/.test(text)) return '甲基化';
  return '其他';
}

function mergeSpecWithBarcode(spec, code) {
  const cleanSpec = String(spec || '').replace(/\s*条形码:\s*\S+\s*/g, '').trim();
  return (cleanSpec ? cleanSpec + ' · ' : '') + '条形码: ' + code;
}

function showLookupCard(title, text) {
  document.getElementById('lookup-title').textContent = title;
  document.getElementById('lookup-text').textContent = text;
  document.getElementById('lookup-card').classList.add('show');
}

function hideLookupCard() {
  document.getElementById('lookup-card').classList.remove('show');
}

function exportData() {
  const payload = {
    app: 'supp_inventory',
    version: 2,
    exportedAt: new Date().toISOString(),
    inventory
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'supp-inventory-backup-' + date + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('备份已导出','success');
}

function importData(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : parsed.inventory;
      if (!Array.isArray(list)) throw new Error('invalid backup');
      const normalized = list.map(normalizeItem).filter(i => i.name);
      if (!normalized.length) throw new Error('empty backup');
      if (!confirm('将导入 '+normalized.length+' 条库存记录，并覆盖当前数据。确定继续吗？')) return;
      inventory = normalized;
      save(); render();
      showToast('导入完成','success');
    } catch(e) {
      showToast('备份文件无法识别','error');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

function showToast(msg, type='success') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2800);
}
