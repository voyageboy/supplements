<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>补剂库存管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2128;
    --border: #2a2d35;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --warn: #f0a060;
    --danger: #f06060;
    --text: #e8eaf0;
    --muted: #6b7080;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .stats-row { display: flex; gap: 10px; }
  .stat-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip .num { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
  .stat-chip.warn .num { color: var(--warn); }
  .stat-chip.ok .num { color: var(--accent); }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 20px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    margin-top: 20px;
  }
  .section-title:first-child { margin-top: 4px; }

  .alert-banner {
    background: linear-gradient(135deg, #2a1a0a, #1e1208);
    border: 1px solid var(--warn);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .alert-banner strong { color: var(--warn); }

  .supp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s;
  }
  .supp-card.low { border-color: #3a2010; background: linear-gradient(135deg, #1e1610, #16181c); }
  .supp-card.critical { border-color: var(--danger); background: linear-gradient(135deg, #2a1010, #16181c); }

  .supp-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .supp-info { flex: 1; min-width: 0; }
  .supp-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .supp-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .supp-right { text-align: right; flex-shrink: 0; }
  .supp-days { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; line-height: 1; margin-bottom: 2px; }
  .supp-days.ok { color: var(--accent); }
  .supp-days.warn { color: var(--warn); }
  .supp-days.critical { color: var(--danger); }
  .supp-days-label { font-size: 10px; color: var(--muted); }

  .progress-wrap { margin-top: 8px; }
  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .progress-fill.ok { background: var(--accent); }
  .progress-fill.warn { background: var(--warn); }
  .progress-fill.critical { background: var(--danger); }

  /* Scan page */
  .scan-area {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 30px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .scan-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #0e0f11;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .scan-btn:active { transform: scale(0.97); opacity: 0.9; }
  .scan-hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

  #scanner-container {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    margin-bottom: 16px;
    display: none;
  }
  #scanner-container video, #scanner-container canvas { width: 100% !important; height: auto !important; display: block; }
  .scan-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame { width: 240px; height: 120px; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
  .scan-line { position: absolute; width: 100%; height: 2px; background: var(--accent); animation: scanline 2s ease-in-out infinite; top: 0; }
  @keyframes scanline { 0%, 100% { top: 10%; opacity: 0.8; } 50% { top: 85%; opacity: 1; } }

  .stop-scan-btn {
    width: 100%; padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    margin-bottom: 16px;
  }

  /* Lookup result card */
  .lookup-card {
    background: linear-gradient(135deg, #0e1a0e, #16181c);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .lookup-card.show { display: block; }
  .lookup-card-title { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .lookup-card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .lookup-card-brand { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .lookup-confirm-btn {
    width: 100%; padding: 11px;
    background: var(--accent);
    color: #0e0f11;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
  }
  .lookup-manual-btn {
    width: 100%; padding: 11px; margin-top: 8px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
  }

  /* Loading spinner */
  .lookup-loading {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .lookup-loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0;
    color: var(--muted); font-size: 12px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }
  input, select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Sora', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent2); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--accent);
    color: #0e0f11;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    font-family: 'Sora', sans-serif;
    cursor: pointer; margin-top: 8px;
    transition: all 0.15s;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

  .btn-small {
    flex: 1; padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    transition: all 0.15s;
  }
  .btn-small:active { transform: scale(0.96); }
  .btn-small.plus { border-color: var(--accent); color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px; font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.info { border-color: var(--accent2); color: var(--accent2); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0 20px;
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 4px 0;
    border: none; background: transparent;
    color: var(--muted);
    font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 600;
    transition: color 0.2s;
  }
  .nav-item .nav-icon { font-size: 22px; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%; max-width: 480px;
    border-top: 1px solid var(--border);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; font-family: 'DM Mono', monospace; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel { flex: 1; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; }
  .btn-confirm { flex: 2; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #0e0f11; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Sora', sans-serif; }

  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { color: var(--muted); }
  .detail-val { font-family: 'DM Mono', monospace; font-weight: 500; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-chip.active { background: var(--accent); color: #0e0f11; border-color: var(--accent); }

  select option { background: var(--surface2); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">补剂<span>库存</span></div>
    <div style="display:flex;gap:8px">
      <div class="stat-chip ok"><span>总计</span><span class="num" id="total-count">0</span></div>
      <div class="stat-chip warn"><span>⚠️ 预警</span><span class="num" id="warn-count">0</span></div>
    </div>
  </div>
</div>

<div class="page active" id="page-home">
  <div id="alert-section"></div>
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterBy('全部', this)">全部</div>
    <div class="filter-chip" onclick="filterBy('甲基化', this)">甲基化</div>
    <div class="filter-chip" onclick="filterBy('线粒体', this)">线粒体</div>
    <div class="filter-chip" onclick="filterBy('抗氧化', this)">抗氧化</div>
    <div class="filter-chip" onclick="filterBy('肠道', this)">肠道</div>
    <div class="filter-chip" onclick="filterBy('矿物质', this)">矿物质</div>
    <div class="filter-chip" onclick="filterBy('其他', this)">其他</div>
  </div>
  <div id="inventory-list"></div>
</div>

<div class="page" id="page-scan">
  <div class="section-title">扫描入库</div>

  <div class="scan-area" id="scan-area">
    <div style="font-size:48px;margin-bottom:16px">📷</div>
    <button class="scan-btn" onclick="startScan()">扫描条形码</button>
    <div class="scan-hint">扫描后自动联网识别产品信息<br>支持 iHerb、亚马逊等海外品牌</div>
  </div>

  <div id="scanner-container">
    <div class="scan-overlay">
      <div class="scan-frame"><div class="scan-line"></div></div>
    </div>
  </div>
  <button class="stop-scan-btn" id="stop-btn" style="display:none" onclick="stopScan()">停止扫描</button>

  <!-- Loading -->
  <div class="lookup-loading" id="lookup-loading">
    <div class="spinner"></div>
    <span>正在查询产品信息…</span>
  </div>

  <!-- Result card -->
  <div class="lookup-card" id="lookup-card">
    <div class="lookup-card-title">✅ 识别成功</div>
    <div class="lookup-card-name" id="lc-name"></div>
    <div class="lookup-card-brand" id="lc-brand"></div>
    <div class="row-2" style="margin-bottom:12px">
      <div class="input-group" style="margin:0">
        <label class="input-label">库存数量</label>
        <input type="number" id="lc-stock" placeholder="粒/片/ml" min="0" />
      </div>
      <div class="input-group" style="margin:0">
        <label class="input-label">每日用量</label>
        <input type="number" id="lc-daily" value="1" min="1" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">分类</label>
      <select id="lc-category">
        <option value="甲基化">甲基化</option>
        <option value="线粒体">线粒体</option>
        <option value="抗氧化">抗氧化</option>
        <option value="肠道">肠道</option>
        <option value="矿物质">矿物质</option>
        <option value="其他" selected>其他</option>
      </select>
    </div>
    <button class="lookup-confirm-btn" onclick="confirmLookup()">➕ 确认入库</button>
    <button class="lookup-manual-btn" onclick="cancelLookup()">手动修改信息</button>
  </div>

  <div class="divider">或手动输入</div>

  <div class="input-group">
    <label class="input-label">补剂名称 *</label>
    <input type="text" id="add-name" placeholder="例：NMN、TMG、镁甘氨酸" />
  </div>
  <div class="input-group">
    <label class="input-label">品牌</label>
    <input type="text" id="add-brand" placeholder="例：Life Extension、NOW Foods" />
  </div>
  <div class="input-group">
    <label class="input-label">分类</label>
    <select id="add-category">
      <option value="甲基化">甲基化</option>
      <option value="线粒体">线粒体</option>
      <option value="抗氧化">抗氧化</option>
      <option value="肠道">肠道</option>
      <option value="矿物质">矿物质</option>
      <option value="其他" selected>其他</option>
    </select>
  </div>
  <div class="row-2">
    <div class="input-group">
      <label class="input-label">库存数量</label>
      <input type="number" id="add-stock" placeholder="例：120" min="0" />
    </div>
    <div class="input-group">
      <label class="input-label">每日用量</label>
      <input type="number" id="add-daily" placeholder="例：2" min="1" value="1" />
    </div>
  </div>
  <div class="input-group">
    <label class="input-label">预警天数</label>
    <input type="number" id="add-threshold" value="14" min="1" />
  </div>
  <div class="input-group">
    <label class="input-label">规格备注</label>
    <input type="text" id="add-spec" placeholder="例：500mg × 60粒/瓶" />
  </div>
  <button class="btn-primary" onclick="addSupplement()">➕ 添加到库存</button>
</div>

<div class="page" id="page-shopping">
  <div class="section-title">需要补货</div>
  <div id="shopping-list"></div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" onclick="showPage('home', this)">
    <span class="nav-icon">📦</span><span>库存</span>
  </button>
  <button class="nav-item" onclick="showPage('scan', this)">
    <span class="nav-icon">➕</span><span>入库</span>
  </button>
  <button class="nav-item" onclick="showPage('shopping', this)">
    <span class="nav-icon">🛒</span><span>补货清单</span>
  </button>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-name"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-details"></div>
    <div class="row-2" style="margin-top:16px;gap:10px">
      <div class="input-group" style="margin:0">
        <label class="input-label">调整数量</label>
        <input type="number" id="modal-adjust" placeholder="输入数量" />
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;justify-content:flex-end">
        <button class="btn-small plus" onclick="adjustStock(1)">+ 入库</button>
        <button class="btn-small" onclick="adjustStock(-1)">− 出库</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">关闭</button>
      <button class="btn-confirm" style="background:#f06060;color:#fff" onclick="deleteItem()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let inventory = JSON.parse(localStorage.getItem('supp_inventory') || '[]');
let currentFilter = '全部';
let activeItemId = null;
let pendingLookup = null;

const CATEGORY_ICONS = { '甲基化':'🧬', '线粒体':'⚡', '抗氧化':'🛡️', '肠道':'🌿', '矿物质':'💎', '其他':'💊' };

function save() { localStorage.setItem('supp_inventory', JSON.stringify(inventory)); }

function getDaysLeft(item) {
  if (!item.daily || item.daily === 0) return 999;
  return Math.floor(item.stock / item.daily);
}

function getStatus(item) {
  const days = getDaysLeft(item);
  const threshold = item.threshold || 14;
  if (days <= 3) return 'critical';
  if (days <= threshold) return 'warn';
  return 'ok';
}

function render() { renderInventory(); renderAlerts(); renderShopping(); updateStats(); }

function updateStats() {
  document.getElementById('total-count').textContent = inventory.length;
  document.getElementById('warn-count').textContent = inventory.filter(i => getStatus(i) !== 'ok').length;
}

function renderInventory() {
  const list = document.getElementById('inventory-list');
  let items = currentFilter === '全部' ? inventory : inventory.filter(i => i.category === currentFilter);
  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">${currentFilter === '全部' ? '📦' : CATEGORY_ICONS[currentFilter]||'💊'}</div><p>${currentFilter === '全部' ? '还没有添加任何补剂<br>点击下方 ➕ 开始入库' : '这个分类暂无补剂'}</p></div>`;
    return;
  }
  items = [...items].sort((a,b) => { const o={critical:0,warn:1,ok:2}; return o[getStatus(a)]-o[getStatus(b)]; });
  list.innerHTML = items.map(item => {
    const days = getDaysLeft(item), status = getStatus(item);
    const threshold = item.threshold || 14;
    const fillPct = Math.min(100, Math.round((days / Math.max(threshold*3, 30)) * 100));
    const icon = CATEGORY_ICONS[item.category] || '💊';
    return `<div class="supp-card ${status}" onclick="openDetail('${item.id}')">
      <div class="supp-icon">${icon}</div>
      <div class="supp-info">
        <div class="supp-name">${item.name}</div>
        <div class="supp-meta">${item.brand||'—'} · ${item.stock} 剩余 · ${item.daily}/天</div>
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill ${status}" style="width:${fillPct}%"></div></div></div>
      </div>
      <div class="supp-right">
        <div class="supp-days ${status}">${days>=999?'∞':days}</div>
        <div class="supp-days-label">天</div>
      </div>
    </div>`;
  }).join('');
}

function renderAlerts() {
  const alerts = inventory.filter(i => getStatus(i) !== 'ok');
  const section = document.getElementById('alert-section');
  section.innerHTML = alerts.length === 0 ? '' : `<div class="alert-banner"><span>⚠️</span><span>有 <strong>${alerts.length} 种</strong>补剂库存不足，请查看补货清单</span></div>`;
}

function renderShopping() {
  const list = document.getElementById('shopping-list');
  const items = inventory.filter(i => getStatus(i) !== 'ok').sort((a,b) => getDaysLeft(a)-getDaysLeft(b));
  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">✅</div><p>所有补剂库存充足<br>暂不需要补货</p></div>`;
    return;
  }
  list.innerHTML = items.map(item => {
    const days = getDaysLeft(item), status = getStatus(item);
    const icon = CATEGORY_ICONS[item.category] || '💊';
    return `<div class="supp-card ${status}" onclick="openDetail('${item.id}')">
      <div class="supp-icon">${icon}</div>
      <div class="supp-info">
        <div class="supp-name">${item.name}</div>
        <div class="supp-meta">${item.brand||'—'} · ${item.spec||''}</div>
        <div class="supp-meta" style="margin-top:2px;color:${status==='critical'?'var(--danger)':'var(--warn)'}">
          ${status==='critical'?'🚨 紧急':'⚠️ 即将用完'} · 仅剩 ${days} 天
        </div>
      </div>
      <div class="supp-right">
        <div class="supp-days ${status}">${days}</div>
        <div class="supp-days-label">天</div>
      </div>
    </div>`;
  }).join('');
}

function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if (name !== 'scan') stopScan();
}

function filterBy(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderInventory();
}

// ===== BARCODE LOOKUP =====
async function lookupBarcode(code) {
  document.getElementById('lookup-loading').classList.add('show');
  document.getElementById('lookup-card').classList.remove('show');

  try {
    // Try Open Food Facts first
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();

    if (data.status === 1 && data.product) {
      const p = data.product;
      const name = p.product_name_en || p.product_name || p.generic_name || '';
      const brand = p.brands || '';
      const quantity = p.quantity || '';

      if (name) {
        pendingLookup = { name, brand, spec: quantity, barcode: code };
        showLookupCard(name, brand, quantity);
        return;
      }
    }

    // Try Open Beauty Facts (supplements often here)
    const res2 = await fetch(`https://world.openbeautyfacts.org/api/v0/product/${code}.json`);
    const data2 = await res2.json();

    if (data2.status === 1 && data2.product) {
      const p = data2.product;
      const name = p.product_name_en || p.product_name || '';
      const brand = p.brands || '';
      if (name) {
        pendingLookup = { name, brand, spec: '', barcode: code };
        showLookupCard(name, brand, '');
        return;
      }
    }

    // Not found — prefill barcode and let user type manually
    pendingLookup = null;
    document.getElementById('lookup-loading').classList.remove('show');
    document.getElementById('add-spec').value = `条形码: ${code}`;
    document.getElementById('add-name').focus();
    showToast('未找到产品信息，请手动填写', 'info');

  } catch(e) {
    pendingLookup = null;
    document.getElementById('lookup-loading').classList.remove('show');
    document.getElementById('add-spec').value = `条形码: ${code}`;
    showToast('网络查询失败，请手动填写', 'info');
  }
}

function showLookupCard(name, brand, spec) {
  document.getElementById('lookup-loading').classList.remove('show');
  document.getElementById('lc-name').textContent = name;
  document.getElementById('lc-brand').textContent = brand + (spec ? ' · ' + spec : '');
  document.getElementById('lc-stock').value = '';
  document.getElementById('lc-daily').value = '1';
  document.getElementById('lookup-card').classList.add('show');
}

function confirmLookup() {
  if (!pendingLookup) return;
  const stock = parseInt(document.getElementById('lc-stock').value);
  if (isNaN(stock) || stock < 0) { showToast('请填写库存数量', 'error'); return; }

  const item = {
    id: Date.now().toString(),
    name: pendingLookup.name,
    brand: pendingLookup.brand,
    category: document.getElementById('lc-category').value,
    stock,
    daily: parseInt(document.getElementById('lc-daily').value) || 1,
    threshold: 14,
    spec: pendingLookup.spec,
    barcode: pendingLookup.barcode,
    addedAt: new Date().toLocaleDateString('zh-CN')
  };

  inventory.push(item);
  save();
  render();
  document.getElementById('lookup-card').classList.remove('show');
  pendingLookup = null;
  showToast(`✅ ${item.name} 已入库`, 'success');
  showPage('home', document.querySelector('.nav-item'));
}

function cancelLookup() {
  if (pendingLookup) {
    document.getElementById('add-name').value = pendingLookup.name;
    document.getElementById('add-brand').value = pendingLookup.brand;
    document.getElementById('add-spec').value = pendingLookup.spec;
  }
  document.getElementById('lookup-card').classList.remove('show');
  pendingLookup = null;
}

// ===== MANUAL ADD =====
function addSupplement() {
  const name = document.getElementById('add-name').value.trim();
  const stock = parseInt(document.getElementById('add-stock').value);
  if (!name) { showToast('请填写补剂名称', 'error'); return; }
  if (isNaN(stock) || stock < 0) { showToast('请填写有效库存数量', 'error'); return; }

  const item = {
    id: Date.now().toString(),
    name,
    brand: document.getElementById('add-brand').value.trim(),
    category: document.getElementById('add-category').value,
    stock,
    daily: parseInt(document.getElementById('add-daily').value) || 1,
    threshold: parseInt(document.getElementById('add-threshold').value) || 14,
    spec: document.getElementById('add-spec').value.trim(),
    addedAt: new Date().toLocaleDateString('zh-CN')
  };

  inventory.push(item);
  save();
  render();
  ['add-name','add-brand','add-stock','add-spec'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-daily').value = '1';
  document.getElementById('add-threshold').value = '14';
  showToast(`✅ ${name} 已入库`, 'success');
  showPage('home', document.querySelector('.nav-item'));
}

// ===== SCAN =====
let scanning = false;
function startScan() {
  const container = document.getElementById('scanner-container');
  container.style.display = 'block';
  document.getElementById('stop-btn').style.display = 'block';
  document.getElementById('scan-area').style.display = 'none';
  scanning = true;

  Quagga.init({
    inputStream: {
      name: 'Live', type: 'LiveStream', target: container,
      constraints: { facingMode: 'environment', width: { min: 640 }, height: { min: 360 } }
    },
    decoder: { readers: ['ean_reader','upc_reader','ean_8_reader','code_128_reader'] },
    locate: true
  }, err => {
    if (err) { showToast('无法访问摄像头', 'error'); stopScan(); return; }
    Quagga.start();
  });

  let lastCode = null;
  Quagga.onDetected(result => {
    const code = result.codeResult.code;
    if (code === lastCode) return;
    lastCode = code;
    stopScan();
    showToast(`📷 条形码: ${code}`, 'info');
    lookupBarcode(code);
  });
}

function stopScan() {
  if (!scanning) return;
  scanning = false;
  try { Quagga.stop(); } catch(e) {}
  document.getElementById('scanner-container').style.display = 'none';
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('scan-area').style.display = 'block';
}

// ===== DETAIL MODAL =====
function openDetail(id) {
  activeItemId = id;
  const item = inventory.find(i => i.id === id);
  if (!item) return;
  const days = getDaysLeft(item);
  document.getElementById('modal-name').textContent = item.name;
  document.getElementById('modal-sub').textContent = `${item.brand||'未知品牌'} · ${item.category}`;
  document.getElementById('modal-details').innerHTML = `
    <div class="detail-row"><span class="detail-key">当前库存</span><span class="detail-val">${item.stock} 粒/片/ml</span></div>
    <div class="detail-row"><span class="detail-key">每日用量</span><span class="detail-val">${item.daily} /天</span></div>
    <div class="detail-row"><span class="detail-key">预计还剩</span><span class="detail-val" style="color:var(--${getStatus(item)==='ok'?'accent':getStatus(item)==='warn'?'warn':'danger'})">${days>=999?'充足':days+' 天'}</span></div>
    <div class="detail-row"><span class="detail-key">预警天数</span><span class="detail-val">${item.threshold} 天</span></div>
    ${item.spec?`<div class="detail-row"><span class="detail-key">规格</span><span class="detail-val">${item.spec}</span></div>`:''}
    <div class="detail-row"><span class="detail-key">入库时间</span><span class="detail-val">${item.addedAt}</span></div>
  `;
  document.getElementById('modal-adjust').value = '';
  document.getElementById('detail-modal').classList.add('show');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('show'); activeItemId = null; }

function adjustStock(direction) {
  const amount = parseInt(document.getElementById('modal-adjust').value);
  if (isNaN(amount) || amount <= 0) { showToast('请输入有效数量', 'error'); return; }
  const item = inventory.find(i => i.id === activeItemId);
  if (!item) return;
  item.stock = Math.max(0, item.stock + direction * amount);
  save(); render(); closeModal();
  showToast(`${direction>0?'✅ 入库':'📤 出库'} ${amount}，${item.name} 剩余 ${item.stock}`, 'success');
}

function deleteItem() {
  const item = inventory.find(i => i.id === activeItemId);
  if (!item || !confirm(`确定删除「${item.name}」吗？`)) return;
  inventory = inventory.filter(i => i.id !== activeItemId);
  save(); render(); closeModal();
  showToast(`已删除 ${item.name}`, 'error');
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2800);
}
