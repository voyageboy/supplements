<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>补剂库存管理</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #171a20;
    --panel-2: #20242c;
    --panel-3: #12151a;
    --border: #313642;
    --text: #f1f4f8;
    --muted: #8a92a3;
    --dim: #596170;
    --accent: #c8f060;
    --cyan: #60c8f0;
    --warn: #f2a45f;
    --danger: #f05f68;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }

  .app { min-height: 100vh; padding-bottom: 84px; }
  .sidebar { display: none; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(13, 15, 18, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px);
    padding: 20px;
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-size: 22px; font-weight: 800; }
  .subtitle { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .stat-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .stat { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); padding: 10px 12px; }
  .stat span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .stat strong { display: block; margin-top: 4px; font-size: 20px; line-height: 1; }
  .stat.warn strong { color: var(--warn); }
  .stat.ok strong { color: var(--accent); }

  .content { padding: 18px 20px; max-width: 1180px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  .page-head { display: none; }
  .section { margin-top: 18px; }
  .section-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .alert {
    display: none;
    border: 1px solid var(--warn);
    border-left-width: 4px;
    background: #312316;
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .alert.show { display: block; }

  .category-mark {
    width: 34px;
    height: 34px;
    border: 1px solid currentColor;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
    font-size: 12px;
    font-weight: 900;
    flex: 0 0 auto;
  }

  .inventory-header { display: none; }
  .inventory-list { display: grid; gap: 10px; }
  .item-row {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: var(--radius);
    padding: 14px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    width: 100%;
    color: var(--text);
    text-align: left;
    font: inherit;
  }
  .item-row.warn { background: #312316; border-color: var(--warn); }
  .item-row.critical { background: #32191b; border-color: var(--danger); }
  .item-row.plenty { opacity: 0.72; }
  .item-title { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { color: var(--muted); font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-cell { text-align: right; min-width: 54px; }
  .stock-num { font-size: 28px; line-height: 1; font-weight: 900; color: var(--accent); }
  .warn .stock-num { color: var(--warn); }
  .critical .stock-num { color: var(--danger); }
  .plenty .stock-num { color: var(--muted); }
  .stock-unit { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .status-bar { height: 10px; width: 46px; border-radius: 999px; background: var(--accent); margin: 7px 0 0 auto; }
  .warn .status-bar { background: var(--warn); }
  .critical .status-bar { background: var(--danger); }
  .plenty .status-bar { background: var(--dim); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .panel + .panel { margin-top: 14px; }
  .panel-title { font-size: 15px; font-weight: 850; margin-bottom: 8px; }
  .panel-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid { display: grid; gap: 12px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--panel-3);
    color: var(--text);
    border-radius: var(--radius);
    outline: none;
  }
  input, select { height: 42px; padding: 0 12px; }
  textarea { min-height: 104px; resize: vertical; padding: 11px 12px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { border-color: var(--cyan); }

  .btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: var(--radius);
    min-height: 40px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 850;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.cyan { border-color: var(--cyan); color: var(--cyan); }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.full { width: 100%; }

  .scan-area {
    border: 1px dashed var(--border);
    background: var(--panel);
    border-radius: 14px;
    padding: 16px;
  }
  .scan-visual {
    height: 72px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: repeating-linear-gradient(90deg, var(--panel-2) 0 4px, transparent 4px 9px);
    opacity: 0.8;
    margin-bottom: 12px;
  }
  #scanner-container { display: none; position: relative; overflow: hidden; border-radius: 14px; background: #000; margin-top: 12px; }
  #scanner-video { width: 100%; display: block; }
  .scan-overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .scan-frame { width: 240px; height: 110px; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,.38); }

  .category-list { display: grid; gap: 10px; }
  .category-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    width: 100%;
    color: var(--text);
    text-align: left;
    font: inherit;
  }
  .category-name { font-size: 14px; font-weight: 800; }
  .category-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 8px 8px 18px;
  }
  .nav-item {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 2px;
    font-size: 11px;
    font-weight: 850;
  }
  .nav-item::before {
    content: "";
    display: block;
    height: 3px;
    width: 34px;
    border-radius: 999px;
    background: var(--dim);
    margin: 0 auto 7px;
  }
  .nav-item.active { color: var(--accent); background: #1d251a; border-color: var(--accent); }
  .nav-item.active::before { background: var(--accent); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: rgba(0,0,0,.72);
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 20px;
  }
  .modal-title { font-size: 18px; font-weight: 900; }
  .modal-sub { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.45; }
  .stock-control { display: grid; grid-template-columns: 56px 1fr 56px; gap: 14px; align-items: center; margin: 18px 0; }
  .round-btn { height: 56px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 26px; }
  .stock-big { text-align: center; font-size: 54px; font-weight: 950; line-height: 1; color: var(--accent); }
  .stock-big.warn { color: var(--warn); }
  .stock-big.critical { color: var(--danger); }
  .stock-big.plenty { color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 92px;
    z-index: 200;
    transform: translateX(-50%) translateY(20px);
    opacity: 0;
    pointer-events: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 800;
    max-width: calc(100vw - 32px);
    white-space: nowrap;
    transition: all .22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.info { border-color: var(--cyan); color: var(--cyan); }

  .empty { color: var(--muted); border: 1px dashed var(--border); border-radius: 14px; padding: 34px 18px; text-align: center; font-size: 13px; }
  .hidden-file { display: none; }

  @media (min-width: 860px) {
    body { overflow-y: scroll; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); padding-bottom: 0; }
    .sidebar {
      display: block;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 28px;
    }
    .sidebar .brand { margin-bottom: 6px; }
    .side-nav { display: grid; gap: 10px; margin-top: 36px; }
    .side-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      height: 42px;
      padding: 0 14px;
      text-align: left;
      font-weight: 850;
    }
    .side-item::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 18px;
      margin-right: 12px;
      border-radius: 99px;
      background: var(--dim);
      vertical-align: -4px;
    }
    .side-item.active { color: var(--accent); background: #1d251a; border-color: var(--accent); }
    .side-item.active::before { background: var(--accent); }
    .topbar { position: static; background: transparent; border-bottom: 0; padding: 28px 36px 0; }
    .topbar .brand, .topbar .subtitle { display: none; }
    .stat-strip { grid-template-columns: repeat(4, 138px); margin-top: 0; }
    .content { margin: 0; padding: 24px 36px 48px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .page-head h1 { font-size: 28px; }
    .page-head p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .bottom-nav { display: none; }
    .inventory-header {
      display: grid;
      grid-template-columns: 250px 170px 130px 90px 90px 60px;
      gap: 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0 18px 8px;
    }
    .inventory-list { gap: 8px; }
    .item-row {
      grid-template-columns: 250px 170px 130px 90px 90px 60px;
      gap: 14px;
      padding: 12px 18px;
      min-height: 58px;
    }
    .item-row .category-mark { width: 34px; height: 34px; }
    .item-info { display: contents; }
    .item-title { align-self: center; }
    .item-meta { align-self: center; margin: 0; }
    .desktop-category { display: flex; align-items: center; gap: 10px; }
    .desktop-status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 800; align-self: center; }
    .desktop-status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .warn .desktop-status::before { background: var(--warn); }
    .critical .desktop-status::before { background: var(--danger); }
    .plenty .desktop-status::before { background: var(--dim); }
    .stock-cell { text-align: left; align-self: center; }
    .stock-num { font-size: 20px; display: inline; }
    .stock-unit { display: inline; margin-left: 4px; }
    .status-bar { display: none; }
    .mobile-only { display: none !important; }
    .desktop-only { display: initial !important; }
    .modal-overlay { align-items: center; }
    .modal { border-radius: 18px; }
    .form-grid.desktop-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid.desktop-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 859px) {
    .desktop-only { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">补剂库存</div>
    <div class="subtitle">iHerb Inventory</div>
    <div class="side-nav" id="side-nav"></div>
  </aside>

  <main>
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <div class="brand">补剂库存</div>
          <div class="subtitle" id="mobile-subtitle">库存工作台</div>
        </div>
      </div>
      <div class="stat-strip">
        <div class="stat ok"><span>总计</span><strong id="stat-total">0</strong></div>
        <div class="stat warn"><span>低库存</span><strong id="stat-low">0</strong></div>
        <div class="stat"><span>条码</span><strong id="stat-barcodes">0</strong></div>
        <div class="stat"><span>分类</span><strong id="stat-categories">0</strong></div>
      </div>
    </header>

    <div class="content">
      <section class="page active" id="page-home">
        <div class="page-head">
          <div><h1>库存工作台</h1><p>搜索、筛选和编辑当前补剂库存。</p></div>
          <button class="btn primary" onclick="showPage('add')">新增</button>
        </div>
        <div class="alert" id="alert-section"></div>
        <div class="toolbar section">
          <input id="search-input" type="search" placeholder="搜索名称 / 品牌 / 条码 / iHerb 编号" oninput="renderInventory()" />
        </div>
        <div class="filter-row section" id="filter-row"></div>
        <div class="inventory-header">
          <div>名称</div><div>品牌</div><div>分类</div><div>库存</div><div>状态</div><div></div>
        </div>
        <div id="inventory-list" class="inventory-list"></div>
      </section>

      <section class="page" id="page-add">
        <div class="page-head">
          <div><h1>入库</h1><p>扫码、拍照识别，或粘贴 iHerb 信息。</p></div>
        </div>
        <div class="scan-area">
          <div class="scan-visual"></div>
          <div class="toolbar">
            <button class="btn primary" onclick="startScan()">扫描条码</button>
            <button class="btn cyan" onclick="document.getElementById('barcode-photo').click()">拍照识别</button>
            <button class="btn" id="stop-btn" style="display:none" onclick="stopScan()">停止</button>
          </div>
          <input id="barcode-photo" class="hidden-file" type="file" accept="image/*" capture="environment" onchange="scanBarcodeImage(event)">
          <div id="scanner-container">
            <video id="scanner-video" autoplay muted playsinline></video>
            <div class="scan-overlay"><div class="scan-frame"></div></div>
          </div>
        </div>

        <div class="panel section" id="lookup-card" style="display:none">
          <div class="panel-title" id="lookup-title">条码识别</div>
          <div class="panel-note" id="lookup-text"></div>
        </div>

        <div class="panel section">
          <div class="panel-title">iHerb 导入</div>
          <div class="form-grid">
            <div class="field"><label>商品链接</label><input type="url" id="add-iherb-url" placeholder="https://www.iherb.com/pr/..."></div>
            <div class="field"><label>页面文字 / 商品信息</label><textarea id="iherb-paste" placeholder="粘贴商品标题、UPC、Item # 或订单中的商品信息"></textarea></div>
            <div class="toolbar">
              <button class="btn cyan" onclick="parseIherbInfo()">解析并填入</button>
              <button class="btn" onclick="clearIherbImport()">清空</button>
            </div>
          </div>
        </div>

        <div class="panel section">
          <div class="panel-title">补剂信息</div>
          <div class="form-grid desktop-two">
            <div class="field"><label>条码</label><input type="text" id="add-barcode" inputmode="numeric" placeholder="扫码或手动输入"></div>
            <div class="field"><label>分类</label><select id="add-category"></select></div>
            <div class="field"><label>名称</label><input type="text" id="add-name" placeholder="NMN / TMG / Magnesium"></div>
            <div class="field"><label>品牌</label><input type="text" id="add-brand" placeholder="Life Extension / NOW Foods"></div>
            <div class="field"><label>规格</label><input type="text" id="add-spec" placeholder="500mg x 120 capsules"></div>
            <div class="grid-2">
              <div class="field"><label>库存</label><input type="number" id="add-stock" min="0" value="1"></div>
              <div class="field"><label>阈值</label><input type="number" id="add-threshold" min="0" value="1"></div>
            </div>
            <div class="field"><label>单位</label><select id="add-unit"></select></div>
          </div>
          <div class="toolbar section">
            <button class="btn cyan" onclick="lookupBarcodeFromInput()">查询条码</button>
            <button class="btn primary" onclick="addSupplement()">添加到库存</button>
          </div>
        </div>
      </section>

      <section class="page" id="page-shopping">
        <div class="page-head">
          <div><h1>补货清单</h1><p>库存低于各自阈值的项目。</p></div>
        </div>
        <div id="shopping-list" class="inventory-list"></div>
      </section>

      <section class="page" id="page-categories">
        <div class="page-head">
          <div><h1>分类管理</h1><p>用短标和颜色管理分类，不使用图片或 emoji。</p></div>
        </div>
        <div class="panel">
          <div class="form-grid desktop-three">
            <div class="field"><label>名称</label><input id="cat-name" placeholder="睡眠"></div>
            <div class="field"><label>短标</label><input id="cat-code" maxlength="4" placeholder="SL"></div>
            <div class="field"><label>颜色</label><input id="cat-color" type="color" value="#c8f060"></div>
            <div class="field"><label>默认阈值</label><input id="cat-threshold" type="number" min="0" value="1"></div>
            <div class="field"><label>删除迁移到</label><select id="cat-replacement"></select></div>
          </div>
          <div class="toolbar section">
            <button class="btn primary" onclick="saveCategory()">保存分类</button>
            <button class="btn" onclick="newCategory()">新建</button>
            <button class="btn danger" onclick="deleteCategory()">删除</button>
          </div>
        </div>
        <div class="section category-list" id="category-list"></div>
      </section>

      <section class="page" id="page-backup">
        <div class="page-head">
          <div><h1>备份</h1><p>数据保存在当前浏览器，建议定期导出。</p></div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <button class="btn primary" onclick="exportData()">导出备份</button>
            <button class="btn cyan" onclick="document.getElementById('import-file').click()">导入备份</button>
          </div>
          <input id="import-file" class="hidden-file" type="file" accept="application/json,.json" onchange="importData(event)">
        </div>
      </section>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<div class="modal-overlay" id="item-modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-name"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="stock-control">
      <button class="round-btn" onclick="quickAdj(-1)">-</button>
      <div class="stock-big" id="modal-stock">0</div>
      <button class="round-btn" onclick="quickAdj(1)">+</button>
    </div>
    <div class="form-grid desktop-two">
      <div class="field"><label>名称</label><input id="edit-name"></div>
      <div class="field"><label>品牌</label><input id="edit-brand"></div>
      <div class="field"><label>分类</label><select id="edit-category"></select></div>
      <div class="field"><label>单位</label><select id="edit-unit"></select></div>
      <div class="field"><label>规格</label><input id="edit-spec"></div>
      <div class="field"><label>条码</label><input id="edit-barcode"></div>
      <div class="field"><label>库存</label><input type="number" id="edit-stock" min="0"></div>
      <div class="field"><label>阈值</label><input type="number" id="edit-threshold" min="0"></div>
      <div class="field"><label>iHerb 链接</label><input type="url" id="edit-iherb-url"></div>
    </div>
    <div class="toolbar section">
      <button class="btn primary" onclick="saveItemEdit()">保存</button>
      <button class="btn danger" onclick="deleteItem()">删除</button>
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_ITEMS = 'supp_inventory';
const STORAGE_CATEGORIES = 'supp_categories';
const UNITS = ['瓶','罐','袋','盒','支','ml','个'];
const BARCODE_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39'];
const ZXING_CDN = 'https://unpkg.com/@zxing/browser@0.2.0/umd/zxing-browser.min.js';

let categories = loadCategories();
let inventory = loadInventory();
let currentPage = 'home';
let currentFilter = 'all';
let activeItemId = null;
let activeCategoryId = null;
let scanStream = null;
let scanTimer = null;
let barcodeDetector = null;
let zxingControls = null;
let zxingLoading = null;

const NAV = [
  ['home','库存'],
  ['add','入库'],
  ['shopping','补货'],
  ['categories','分类'],
  ['backup','备份']
];

function safeParse(raw, fallback) {
  try { const value = JSON.parse(raw || ''); return value ?? fallback; }
  catch(e) { return fallback; }
}

function defaultCategories() {
  return [
    { id:'methyl', name:'甲基化', code:'MT', color:'#c8f060', threshold:1 },
    { id:'mito', name:'线粒体', code:'EN', color:'#60c8f0', threshold:1 },
    { id:'antiox', name:'抗氧化', code:'AO', color:'#9ca3ff', threshold:1 },
    { id:'gut', name:'肠道', code:'GT', color:'#7dd98a', threshold:1 },
    { id:'mineral', name:'矿物质', code:'MN', color:'#f2a45f', threshold:1 },
    { id:'other', name:'其他', code:'OT', color:'#8a92a3', threshold:1, locked:true }
  ];
}

function loadCategories() {
  const saved = safeParse(localStorage.getItem(STORAGE_CATEGORIES), null);
  const list = Array.isArray(saved) && saved.length ? saved : defaultCategories();
  return list.map(normalizeCategory);
}

function loadInventory() {
  const raw = safeParse(localStorage.getItem(STORAGE_ITEMS), []);
  return (Array.isArray(raw) ? raw : []).map(normalizeItem).filter(item => item.name);
}

function makeId(prefix='id') {
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalizeCategory(cat) {
  const name = String(cat.name || '其他').trim();
  return {
    id: String(cat.id || makeId('cat')),
    name,
    code: String(cat.code || name.slice(0,2) || 'OT').trim().toUpperCase().slice(0,4),
    color: /^#[0-9a-f]{6}$/i.test(cat.color || '') ? cat.color : '#8a92a3',
    threshold: Math.max(0, parseInt(cat.threshold ?? 1) || 0),
    locked: !!cat.locked
  };
}

function categoryByName(name) {
  return categories.find(cat => cat.name === name) || categories.find(cat => cat.id === name);
}

function categoryById(id) {
  return categories.find(cat => cat.id === id) || categories.find(cat => cat.id === 'other') || categories[0];
}

function normalizeItem(item) {
  const category = item.categoryId ? categoryById(item.categoryId) : categoryByName(item.category) || categoryById('other');
  return {
    id: String(item.id || makeId('item')),
    name: String(item.name || '').trim(),
    brand: String(item.brand || '').trim(),
    categoryId: category.id,
    stock: Math.max(0, parseInt(item.stock ?? 0) || 0),
    threshold: Math.max(0, parseInt(item.threshold ?? category.threshold ?? 1) || 0),
    unit: UNITS.includes(item.unit) ? item.unit : '瓶',
    spec: String(item.spec || '').trim(),
    barcode: String(item.barcode || '').trim(),
    iherbUrl: String(item.iherbUrl || '').trim(),
    addedAt: item.addedAt || new Date().toLocaleDateString('zh-CN')
  };
}

function saveAll() {
  localStorage.setItem(STORAGE_ITEMS, JSON.stringify(inventory));
  localStorage.setItem(STORAGE_CATEGORIES, JSON.stringify(categories));
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function getStatus(item) {
  if (item.stock === 0) return 'critical';
  if (item.stock <= item.threshold) return 'warn';
  if (item.stock >= Math.max(5, item.threshold + 4)) return 'plenty';
  return 'ok';
}

function statusText(status) {
  return status === 'critical' ? '空' : status === 'warn' ? '低' : status === 'plenty' ? '足' : '正常';
}

function categoryMark(cat) {
  return '<span class="category-mark" style="color:'+escapeHTML(cat.color)+'">'+escapeHTML(cat.code)+'</span>';
}

function render() {
  renderNav();
  renderStats();
  renderCategoryOptions();
  renderFilters();
  renderInventory();
  renderShopping();
  renderCategories();
  saveAll();
}

function renderNav() {
  const html = NAV.map(([id, label]) => '<button class="nav-item '+(currentPage===id?'active':'')+'" onclick="showPage(\''+id+'\')">'+label+'</button>').join('');
  const side = NAV.map(([id, label]) => '<button class="side-item '+(currentPage===id?'active':'')+'" onclick="showPage(\''+id+'\')">'+label+'</button>').join('');
  document.getElementById('bottom-nav').innerHTML = html;
  document.getElementById('side-nav').innerHTML = side;
}

function renderStats() {
  const low = inventory.filter(item => ['critical','warn'].includes(getStatus(item))).length;
  document.getElementById('stat-total').textContent = inventory.length;
  document.getElementById('stat-low').textContent = low;
  document.getElementById('stat-barcodes').textContent = inventory.filter(item => item.barcode).length;
  document.getElementById('stat-categories').textContent = categories.length;
  const alert = document.getElementById('alert-section');
  alert.classList.toggle('show', low > 0);
  alert.textContent = low ? low + ' 个项目低于补货阈值' : '';
}

function renderCategoryOptions() {
  const options = categories.map(cat => '<option value="'+cat.id+'">'+escapeHTML(cat.name)+'</option>').join('');
  ['add-category','edit-category','cat-replacement'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = options;
  });
  const unitOptions = UNITS.map(unit => '<option value="'+unit+'">'+unit+'</option>').join('');
  ['add-unit','edit-unit'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = unitOptions;
  });
}

function renderFilters() {
  const chips = ['<button class="chip '+(currentFilter==='all'?'active':'')+'" onclick="setFilter(\'all\')">全部</button>']
    .concat(categories.map(cat => '<button class="chip '+(currentFilter===cat.id?'active':'')+'" onclick="setFilter(\''+cat.id+'\')">'+escapeHTML(cat.name)+'</button>'))
    .join('');
  document.getElementById('filter-row').innerHTML = chips;
}

function renderInventory() {
  const query = document.getElementById('search-input')?.value.trim().toLowerCase() || '';
  let items = inventory.slice();
  if (currentFilter !== 'all') items = items.filter(item => item.categoryId === currentFilter);
  if (query) {
    items = items.filter(item => [item.name,item.brand,item.spec,item.barcode,item.iherbUrl,categoryById(item.categoryId).name].join(' ').toLowerCase().includes(query));
  }
  const order = { critical:0, warn:1, ok:2, plenty:3 };
  items.sort((a,b) => order[getStatus(a)] - order[getStatus(b)] || a.name.localeCompare(b.name));
  const list = document.getElementById('inventory-list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">暂无匹配库存</div>';
    return;
  }
  list.innerHTML = items.map(itemRowHTML).join('');
}

function itemRowHTML(item) {
  const cat = categoryById(item.categoryId);
  const status = getStatus(item);
  return '<button class="item-row '+status+'" onclick="openDetail(\''+item.id+'\')">'
    + '<div class="item-info">'
    +   '<div class="item-title">'+escapeHTML(item.name)+'</div>'
    +   '<div class="item-meta">'+escapeHTML(item.brand || '-')+'</div>'
    +   '<div class="desktop-category desktop-only">'+categoryMark(cat)+'<span>'+escapeHTML(cat.name)+'</span></div>'
    + '</div>'
    + '<div class="mobile-only">'+categoryMark(cat)+'</div>'
    + '<div class="stock-cell"><span class="stock-num">'+item.stock+'</span><span class="stock-unit">'+escapeHTML(item.unit)+'</span><div class="status-bar"></div></div>'
    + '<div class="desktop-status desktop-only">'+statusText(status)+'</div>'
    + '<div class="desktop-only">'+escapeHTML(item.barcode || '-隐-').replace('-隐-','-')+'</div>'
    + '</button>';
}

function renderShopping() {
  const items = inventory.filter(item => ['critical','warn'].includes(getStatus(item))).sort((a,b)=>a.stock-b.stock);
  document.getElementById('shopping-list').innerHTML = items.length ? items.map(itemRowHTML).join('') : '<div class="empty">暂无补货项目</div>';
}

function renderCategories() {
  document.getElementById('category-list').innerHTML = categories.map(cat => {
    const count = inventory.filter(item => item.categoryId === cat.id).length;
    return '<button class="category-row" onclick="editCategory(\''+cat.id+'\')">'
      + categoryMark(cat)
      + '<div><div class="category-name">'+escapeHTML(cat.name)+'</div><div class="category-sub">'+count+' 项 · 默认阈值 '+cat.threshold+'</div></div>'
      + '<span class="btn">编辑</span>'
      + '</button>';
  }).join('');
}

function showPage(id) {
  currentPage = id;
  document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const subtitles = { home:'库存工作台', add:'入库', shopping:'补货清单', categories:'分类管理', backup:'备份' };
  document.getElementById('mobile-subtitle').textContent = subtitles[id] || '';
  if (id !== 'add') stopScan();
  renderNav();
}

function setFilter(id) {
  currentFilter = id;
  renderFilters();
  renderInventory();
}

function addSupplement() {
  const name = value('add-name');
  const stock = parseInt(value('add-stock'));
  const threshold = parseInt(value('add-threshold'));
  const barcode = value('add-barcode');
  if (!name) return showToast('请填写名称','error');
  if (isNaN(stock) || stock < 0) return showToast('库存无效','error');
  if (isNaN(threshold) || threshold < 0) return showToast('阈值无效','error');
  if (barcode && inventory.some(item => item.barcode === barcode)) return showToast('条码已存在','error');
  inventory.push(normalizeItem({
    name,
    brand: value('add-brand'),
    categoryId: value('add-category'),
    stock,
    threshold,
    unit: value('add-unit'),
    spec: value('add-spec'),
    barcode,
    iherbUrl: value('add-iherb-url')
  }));
  ['add-name','add-brand','add-spec','add-barcode','add-iherb-url','iherb-paste'].forEach(id => setValue(id,''));
  setValue('add-stock','1');
  setValue('add-threshold','1');
  hideLookupCard();
  showToast('已添加','success');
  showPage('home');
  render();
}

function value(id) { return document.getElementById(id).value.trim(); }
function setValue(id, val) { document.getElementById(id).value = val; }

function openDetail(id) {
  activeItemId = id;
  const item = inventory.find(it => it.id === id);
  if (!item) return;
  const cat = categoryById(item.categoryId);
  document.getElementById('modal-name').textContent = item.name;
  document.getElementById('modal-sub').textContent = [item.brand || '未知品牌', cat.name, item.spec, item.barcode ? '条码 '+item.barcode : '', item.iherbUrl ? 'iHerb 已绑定' : ''].filter(Boolean).join(' · ');
  updateModalStock(item);
  setValue('edit-name', item.name);
  setValue('edit-brand', item.brand);
  setValue('edit-category', item.categoryId);
  setValue('edit-unit', item.unit);
  setValue('edit-spec', item.spec);
  setValue('edit-barcode', item.barcode);
  setValue('edit-stock', item.stock);
  setValue('edit-threshold', item.threshold);
  setValue('edit-iherb-url', item.iherbUrl);
  document.getElementById('item-modal').classList.add('show');
}

function updateModalStock(item) {
  const el = document.getElementById('modal-stock');
  el.textContent = item.stock;
  el.className = 'stock-big ' + getStatus(item);
}

function closeModal() {
  activeItemId = null;
  document.getElementById('item-modal').classList.remove('show');
}

function quickAdj(dir) {
  const item = inventory.find(it => it.id === activeItemId);
  if (!item) return;
  item.stock = Math.max(0, item.stock + dir);
  setValue('edit-stock', item.stock);
  updateModalStock(item);
  render();
}

function saveItemEdit() {
  const item = inventory.find(it => it.id === activeItemId);
  if (!item) return;
  const name = value('edit-name');
  if (!name) return showToast('名称不能为空','error');
  const barcode = value('edit-barcode');
  if (barcode && inventory.some(it => it.id !== item.id && it.barcode === barcode)) return showToast('条码已存在','error');
  Object.assign(item, normalizeItem({
    ...item,
    name,
    brand: value('edit-brand'),
    categoryId: value('edit-category'),
    unit: value('edit-unit'),
    spec: value('edit-spec'),
    barcode,
    stock: parseInt(value('edit-stock')),
    threshold: parseInt(value('edit-threshold')),
    iherbUrl: value('edit-iherb-url')
  }));
  render();
  openDetail(item.id);
  showToast('已保存','success');
}

function deleteItem() {
  const item = inventory.find(it => it.id === activeItemId);
  if (!item || !confirm('删除 '+item.name+'？')) return;
  inventory = inventory.filter(it => it.id !== activeItemId);
  closeModal();
  render();
  showToast('已删除','info');
}

function newCategory() {
  activeCategoryId = null;
  setValue('cat-name','');
  setValue('cat-code','');
  setValue('cat-color','#c8f060');
  setValue('cat-threshold','1');
}

function editCategory(id) {
  const cat = categoryById(id);
  activeCategoryId = cat.id;
  setValue('cat-name', cat.name);
  setValue('cat-code', cat.code);
  setValue('cat-color', cat.color);
  setValue('cat-threshold', cat.threshold);
}

function saveCategory() {
  const name = value('cat-name');
  const code = value('cat-code').toUpperCase();
  const color = value('cat-color');
  const threshold = parseInt(value('cat-threshold'));
  if (!name || !code) return showToast('分类名称和短标必填','error');
  if (isNaN(threshold) || threshold < 0) return showToast('阈值无效','error');
  if (activeCategoryId) {
    const cat = categoryById(activeCategoryId);
    Object.assign(cat, normalizeCategory({ ...cat, name, code, color, threshold }));
  } else {
    categories.push(normalizeCategory({ id: makeId('cat'), name, code, color, threshold }));
  }
  newCategory();
  render();
  showToast('分类已保存','success');
}

function deleteCategory() {
  if (!activeCategoryId) return showToast('请选择分类','error');
  const cat = categoryById(activeCategoryId);
  if (cat.locked || categories.length <= 1) return showToast('此分类不能删除','error');
  const replacement = value('cat-replacement');
  if (replacement === cat.id) return showToast('请选择其他迁移分类','error');
  if (!confirm('删除分类 '+cat.name+'？')) return;
  inventory.forEach(item => { if (item.categoryId === cat.id) item.categoryId = replacement; });
  categories = categories.filter(item => item.id !== cat.id);
  if (currentFilter === cat.id) currentFilter = 'all';
  newCategory();
  render();
  showToast('分类已删除','info');
}

async function startScan() {
  if (!('BarcodeDetector' in window)) return startZxingScan();
  try {
    barcodeDetector = new BarcodeDetector({ formats: BARCODE_FORMATS });
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal:'environment' } }, audio: false });
    const video = document.getElementById('scanner-video');
    video.srcObject = scanStream;
    await video.play();
    showScanner(true);
    scanLoop();
  } catch(e) {
    stopScan();
    showLookupCard('无法打开摄像头', '可使用拍照识别或手动输入条码。');
  }
}

async function scanLoop() {
  if (!barcodeDetector) return;
  try {
    const codes = await barcodeDetector.detect(document.getElementById('scanner-video'));
    if (codes && codes[0]) return handleBarcode(codes[0].rawValue);
  } catch(e) {}
  scanTimer = setTimeout(scanLoop, 450);
}

async function startZxingScan() {
  try {
    await loadZxing();
    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    showScanner(true);
    zxingControls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal:'environment' } }, audio:false },
      document.getElementById('scanner-video'),
      result => { if (result) handleBarcode(result.getText ? result.getText() : result.text); }
    );
  } catch(e) {
    stopScan();
    showLookupCard('扫码不可用', '请使用拍照识别或手动输入条码。');
  }
}

function showScanner(on) {
  document.getElementById('scanner-container').style.display = on ? 'block' : 'none';
  document.getElementById('stop-btn').style.display = on ? 'inline-flex' : 'none';
}

function stopScan() {
  if (scanTimer) clearTimeout(scanTimer);
  scanTimer = null;
  if (zxingControls?.stop) { try { zxingControls.stop(); } catch(e) {} }
  zxingControls = null;
  if (scanStream) scanStream.getTracks().forEach(track => track.stop());
  scanStream = null;
  barcodeDetector = null;
  const video = document.getElementById('scanner-video');
  if (video) video.srcObject = null;
  showScanner(false);
}

async function scanBarcodeImage(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    await loadZxing();
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async () => {
      try {
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        const result = await reader.decodeFromImageElement(img);
        await handleBarcode(result.getText ? result.getText() : result.text);
      } catch(e) {
        showLookupCard('照片未识别', '请让条码更清晰、更大一些。');
      } finally {
        URL.revokeObjectURL(url);
        event.target.value = '';
      }
    };
    img.src = url;
  } catch(e) {
    showLookupCard('拍照识别不可用', '请手动输入条码。');
  }
}

function loadZxing() {
  if (window.ZXingBrowser) return Promise.resolve();
  if (zxingLoading) return zxingLoading;
  zxingLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = ZXING_CDN;
    script.async = true;
    script.onload = () => window.ZXingBrowser ? resolve() : reject();
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return zxingLoading;
}

async function handleBarcode(code) {
  const clean = String(code || '').trim();
  if (!clean) return;
  stopScan();
  setValue('add-barcode', clean);
  const existing = inventory.find(item => item.barcode === clean);
  if (existing) {
    showToast('已找到库存项','success');
    openDetail(existing.id);
    return;
  }
  await lookupBarcode(clean);
}

function lookupBarcodeFromInput() {
  const code = value('add-barcode');
  if (!code) return showToast('请先输入条码','error');
  handleBarcode(code);
}

async function lookupBarcode(code) {
  showLookupCard('正在查询', '条码 '+code);
  const fields = 'product_name,brands,quantity,serving_size,categories,categories_tags';
  const urls = [
    'https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields,
    'https://world.openproductsfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields,
    'https://world.openbeautyfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+fields
  ];
  let networkError = false;
  for (const url of urls) {
    const data = await fetchProductInfo(url).catch(() => { networkError = true; return null; });
    if (data?.product) {
      applyProductInfo(data.product, code);
      return;
    }
  }
  setValue('add-spec', mergeSpecWithBarcode(value('add-spec'), code));
  showLookupCard(networkError ? '数据库不可达' : '公开库未收录', '可手动填写并保存为本地条码记录。');
}

async function fetchProductInfo(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, { signal: controller.signal, mode:'cors', cache:'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function applyProductInfo(product, code) {
  if (product.product_name) setValue('add-name', product.product_name);
  if (product.brands) setValue('add-brand', product.brands.split(',')[0].trim());
  const spec = product.quantity || product.serving_size || '';
  setValue('add-spec', mergeSpecWithBarcode(spec || value('add-spec'), code));
  setValue('add-category', inferCategory((product.product_name || '') + ' ' + (product.categories || '')));
  showLookupCard('已填入商品信息', [product.brands, product.product_name, spec].filter(Boolean).join(' · '));
}

function parseIherbInfo() {
  const url = value('add-iherb-url');
  const raw = (url + '\n' + value('iherb-paste')).trim();
  if (!raw) return showToast('请粘贴 iHerb 信息','error');
  const parsed = parseSupplementText(raw, url);
  if (parsed.barcode) setValue('add-barcode', parsed.barcode);
  if (parsed.iherbUrl) setValue('add-iherb-url', parsed.iherbUrl);
  if (parsed.name) setValue('add-name', parsed.name);
  if (parsed.brand) setValue('add-brand', parsed.brand);
  if (parsed.spec) setValue('add-spec', mergeSpecWithBarcode(parsed.spec, parsed.barcode || value('add-barcode')).replace(/\s*·\s*条码:\s*$/, ''));
  setValue('add-category', inferCategory((parsed.name || '') + ' ' + (parsed.spec || '')));
  showToast('已解析','success');
}

function clearIherbImport() {
  setValue('add-iherb-url','');
  setValue('iherb-paste','');
}

function parseSupplementText(raw, explicitUrl) {
  const text = String(raw || '').replace(/\r/g, '\n');
  const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
  const url = explicitUrl || ((text.match(/https?:\/\/(?:www\.)?iherb\.com\/\S+/i) || [])[0] || '');
  const first = lines.find(line => line.length > 5 && !/^https?:\/\//i.test(line)) || '';
  const parts = first.split(',').map(part => part.trim()).filter(Boolean);
  const fromUrl = parseIherbUrl(url);
  return {
    iherbUrl: url,
    barcode: findBarcode(text),
    brand: parts.length > 1 ? parts[0] : fromUrl.brand,
    name: parts.length > 1 ? parts.slice(1).join(', ') : (first || fromUrl.name),
    spec: findSpec(text) || fromUrl.spec
  };
}

function parseIherbUrl(url) {
  if (!url) return {};
  try {
    const u = new URL(url);
    const parts = u.pathname.split('/').filter(Boolean);
    const slug = parts[parts.findIndex(p => p.toLowerCase() === 'pr') + 1] || parts.find(p => p.includes('-')) || '';
    const itemNo = parts.find(p => /^\d{4,}$/.test(p));
    const title = slug.split('-').map(word => /^(mg|mcg|iu|d3|k2|b12|q10|nmn|tmg)$/i.test(word) ? word.toUpperCase() : word.charAt(0).toUpperCase()+word.slice(1)).join(' ');
    return { name: title, spec: [findSpec(title), itemNo ? 'iHerb 商品编号: '+itemNo : ''].filter(Boolean).join(' · ') };
  } catch(e) {
    return {};
  }
}

function findBarcode(text) {
  const labeled = String(text).match(/(?:UPC|Barcode|Bar\s*Code|条形码|EAN|GTIN)\D{0,20}(\d{8,14})/i);
  if (labeled) return labeled[1];
  const standalone = String(text).match(/\b(\d{12,14})\b/);
  return standalone ? standalone[1] : '';
}

function findSpec(text) {
  const patterns = [
    /\b\d+(?:\.\d+)?\s*(?:mg|mcg|g|iu|ml)\b.{0,36}?\b\d+\s*(?:(?:fish|gelatin|veggie|vegetarian|vegan)\s+){0,3}(?:capsules?|softgels?|tablets?|servings?|gummies?|lozenges?|粒|片|胶囊|软胶囊|份|包|袋|瓶)\b/i,
    /\b\d+\s*(?:(?:fish|gelatin|veggie|vegetarian|vegan)\s+){0,3}(?:capsules?|softgels?|tablets?|servings?|gummies?|lozenges?|粒|片|胶囊|软胶囊|份|包|袋|瓶)\b/i,
    /\b\d+(?:\.\d+)?\s*(?:mg|mcg|g|iu|ml)\b/i
  ];
  for (const pattern of patterns) {
    const match = String(text || '').match(pattern);
    if (match) return match[0].trim();
  }
  return '';
}

function inferCategory(text) {
  const t = String(text || '').toLowerCase();
  const matchers = [
    [/magnesium|zinc|iron|calcium|minerals?|镁|锌|铁|钙/, 'mineral'],
    [/probiotic|prebiotic|fiber|gut|益生菌|益生元|肠道/, 'gut'],
    [/omega|fish oil|coq10|q10|nmn|nad|mitochondria|鱼油|辅酶/, 'mito'],
    [/glutathione|vitamin c|antioxidant|resveratrol|抗氧化/, 'antiox'],
    [/methyl|b12|folate|tmg|sam-e|甲基|叶酸/, 'methyl']
  ];
  const found = matchers.find(([regex]) => regex.test(t));
  return found && categoryById(found[1]) ? found[1] : categoryById('other').id;
}

function mergeSpecWithBarcode(spec, code) {
  const base = String(spec || '').replace(/\s*·?\s*条码:\s*\S+\s*/g, '').trim();
  return code ? [base, '条码: '+code].filter(Boolean).join(' · ') : base;
}

function showLookupCard(title, text) {
  document.getElementById('lookup-card').style.display = 'block';
  document.getElementById('lookup-title').textContent = title;
  document.getElementById('lookup-text').textContent = text;
}

function hideLookupCard() {
  document.getElementById('lookup-card').style.display = 'none';
}

function exportData() {
  const payload = { app:'supp_inventory', version:3, exportedAt:new Date().toISOString(), categories, inventory };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'supp-inventory-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已导出','success');
}

function importData(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (Array.isArray(parsed.categories)) categories = parsed.categories.map(normalizeCategory);
      const list = Array.isArray(parsed) ? parsed : parsed.inventory;
      if (!Array.isArray(list)) throw new Error('invalid');
      inventory = list.map(normalizeItem).filter(item => item.name);
      render();
      showToast('已导入','success');
    } catch(e) {
      showToast('导入失败','error');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

function showToast(message, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function seedDemo() {
  if (inventory.length) return;
  inventory = [
    { name:'NMN', brand:'Alive By Science', categoryId:'mito', stock:3, threshold:1, unit:'瓶', spec:'250mg x 60' },
    { name:'TMG', brand:'Jarrow Formulas', categoryId:'methyl', stock:1, threshold:1, unit:'瓶', spec:'500mg x 60' },
    { name:'镁甘氨酸', brand:'Thorne', categoryId:'mineral', stock:0, threshold:1, unit:'瓶', spec:'200mg x 90' },
    { name:'鱼油 Omega-3', brand:'Nordic Naturals', categoryId:'antiox', stock:6, threshold:1, unit:'瓶', spec:'1000mg x 120' }
  ].map(normalizeItem);
}

seedDemo();
render();
newCategory();
